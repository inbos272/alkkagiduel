<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15100b">
<meta name="description" content="바둑판 위에서 알을 튕겨 상대를 밀어내는 알까기 게임 — 알까고. 랭크전·빅 보스전·술래잡기까지 오프라인으로 즐겨요.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="알까고">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/alkkagiduel/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>알까고</title>
<style>
:root{
  --bg:#15100b;--bg2:#1c150f;--panel:#221a13;--panel2:#2b2219;--panel3:#382c20;--line:#4a3a2b;--line-soft:#33291f;
  --text:#f8f1e5;--text-dim:#cbbba3;--text-faint:#8f7f6a;
  --accent:#e8553d;--accent-hi:#ff7d5f;--amber:#f2a03d;--gold:#f3c552;--coin:#f6c94e;--token:#6fd8c8;
  --good:#7ad39b;--danger:#ff6b5b;
  --radius:18px;--radius-sm:12px;--nav-h:62px;font-size:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;min-width:0;margin:0}
body{
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);
  background-image:radial-gradient(120% 75% at 50% -12%,#3b2918 0%,#1d150e 50%,var(--bg) 100%);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
#app{position:relative;width:100%;height:100%;max-width:560px;min-width:0;margin:0 auto;overflow:hidden}
@media (min-width:600px){#app{box-shadow:0 0 0 1px #ffffff0c,0 30px 90px #00000077}}
.screen{position:absolute;inset:0;display:none;flex-direction:column;width:100%;min-width:0}
.screen.active{display:flex;animation:fadeIn .24s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadeOnly{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes pulseBtn{50%{box-shadow:0 0 0 5px #f3c55222;transform:scale(1.04)}}
@keyframes coinFlash{40%{transform:scale(1.15);filter:brightness(1.6)}}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- brand ---------- */
.brand{display:inline-flex;align-items:center;gap:7px;margin:0;font-size:36px;font-weight:900;letter-spacing:-2px;line-height:1}
.brand-stone{width:.62em;height:.62em;border-radius:50%;background:radial-gradient(circle at 34% 30%,#8a8a92 0%,#1b1b20 48%,#050507 100%);box-shadow:0 3px 8px #0009,inset 0 -2px 4px #0008;flex-shrink:0}
.brand-word{background:linear-gradient(180deg,#fffaf0 0%,#f4d7a4 62%,#d6a058 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #00000066)}
.seal{display:inline-flex;align-items:center;justify-content:center;width:1.25em;height:1.25em;font-size:.48em;border-radius:5px;background:var(--accent);color:#fff4ea;transform:rotate(-9deg) translateY(-.15em);box-shadow:inset 0 0 0 2px #ffffff30,0 4px 12px #e8553d55;letter-spacing:0;font-weight:900}

/* ---------- loading ---------- */
#screen-loading{background:radial-gradient(110% 85% at 50% 0%,#4a3018 0%,#1d140c 55%,#0b0806 100%);align-items:center;justify-content:center;padding:22px}
.loading-card{width:min(88vw,360px);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.loading-art{width:min(62vw,230px);aspect-ratio:1;border-radius:30px;overflow:hidden;border:1px solid #ffffff18;box-shadow:0 18px 70px #000a,0 0 0 1px #f2a03d22;background:#120d09}
.loading-art svg{width:100%;height:100%;display:block}
.loading-sub{font-size:10px;color:#a58a68;letter-spacing:3.4px;text-transform:uppercase}
.loading-status{font-size:12px;color:#d9c7aa;min-height:18px}
.loading-bar{width:min(72vw,260px);height:6px;border-radius:99px;background:#0d0906;border:1px solid #3a2c1f;overflow:hidden}
.loading-bar i{display:block;width:0;height:100%;border-radius:99px;background:linear-gradient(90deg,#f2a03d,#e8553d);transition:width .25s ease}
.loading-tip{font-size:11px;color:#8f7f6a;max-width:290px;line-height:1.55}

/* ---------- common ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 6px;min-height:56px}
.topbar .spacer{flex:1}
.backbtn{width:38px;height:38px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;flex-shrink:0}
.screen-title{font-size:19px;font-weight:900;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 16px calc(28px + env(safe-area-inset-bottom));touch-action:pan-y;-webkit-overflow-scrolling:touch;width:100%;min-width:0}
.content::-webkit-scrollbar{display:none}
.screen.tab .content{padding-bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom))}
.icon-round{width:38px;height:38px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 9px;font-size:14.5px;font-weight:900}
.section-title small{font-size:11px;color:var(--text-faint);font-weight:600}
.link{color:var(--amber);font-size:12px;font-weight:800}
.note{font-size:11.5px;color:var(--text-faint);line-height:1.55;margin:0 2px 12px;white-space:pre-line}
.card{border-radius:var(--radius);border:1px solid var(--line-soft);background:linear-gradient(150deg,#2a2118,#1b150f);padding:14px}
.foot-note{text-align:center;font-size:10.5px;color:var(--text-faint);margin-top:18px;opacity:.8}

.wallet{display:flex;gap:5px;flex-shrink:0;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;font-weight:900;font-size:13px;padding:6px 10px;border-radius:99px;white-space:nowrap;border:1px solid;line-height:1}
.pill.coin{color:var(--coin);background:#2e2410;border-color:#f6c94e44}
.pill.token{color:var(--token);background:#0f2826;border-color:#6fd8c844}
.pill small{font-size:9.5px;color:#8fbfb7;font-weight:700}
.pill small:empty{display:none}
.pill.flash{animation:coinFlash .7s ease}
.coin-float{position:fixed;right:22px;top:calc(64px + env(safe-area-inset-top));font-weight:900;font-size:20px;z-index:9999;pointer-events:none;animation:coinFloat 1.15s ease forwards;text-shadow:0 0 14px currentColor}
.coin-float.plus{color:var(--coin)}.coin-float.minus{color:#ff8b78}.coin-float.tok{color:var(--token)}
@keyframes coinFloat{0%{opacity:0;transform:translateY(10px) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translateY(-38px) scale(1.05)}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 14px;border-radius:14px;font-weight:900;font-size:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);text-align:center;line-height:1.25}
.btn:active{transform:scale(.98)}
.btn.primary{border-color:#ff8a6a66;background:linear-gradient(180deg,#ff7d5f,#d6402a);color:#fff;box-shadow:0 10px 26px #e8553d3a,inset 0 1px 0 #ffffff40}
.btn.gold{background:linear-gradient(180deg,#ffe193,#e9a93b);color:#2a1a00;border-color:#ffd16699}
.btn.jade{background:linear-gradient(180deg,#8ff0e0,#3fb5a4);color:#04201c;border-color:#6fd8c899}
.btn.ghost{background:transparent;color:var(--text-dim)}
.btn.block{width:100%}
.btn.big{padding:16px;font-size:16px;border-radius:16px}
.btn.small{padding:8px 11px;font-size:12px;border-radius:11px}
.btn:disabled,.btn.disabled{opacity:.42;box-shadow:none}
.btn .cost{font-size:12px;padding:2px 8px;border-radius:99px;background:#00000038}
.row{display:flex;gap:8px}
.row>.btn{flex:1}

.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--panel);border:1px solid var(--line-soft);margin:6px 0 12px}
.seg button{flex:1;min-width:0;padding:9px 4px;border-radius:10px;font-size:12.5px;font-weight:800;color:var(--text-faint);white-space:nowrap;position:relative}
.seg button.active{background:var(--panel3);color:var(--text);box-shadow:0 2px 8px #0005,inset 0 1px 0 #ffffff10}
.seg .dotn{position:absolute;top:3px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.chip-row{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:72px;padding:10px 8px;border-radius:12px;border:1px solid var(--line-soft);background:var(--panel);text-align:center;font-size:12.5px;color:var(--text-dim);font-weight:700}
.chip small{display:block;font-size:10px;color:var(--text-faint);margin-top:2px;font-weight:600}
.chip.active{border-color:var(--amber);color:var(--gold);background:#3a2a14}
.chip.locked{opacity:.5}
.scroll-row{display:flex;gap:7px;overflow-x:auto;margin:0 -16px 10px;padding:2px 16px 4px;scrollbar-width:none;touch-action:pan-x}
.scroll-row::-webkit-scrollbar{display:none}
.scroll-row .chip{flex:0 0 auto;min-width:0;padding:8px 13px;white-space:nowrap}

/* ---------- bottom nav ---------- */
.bottom-nav{position:absolute;left:0;right:0;bottom:0;z-index:20;display:none;grid-template-columns:repeat(4,1fr);height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(180deg,rgba(30,22,15,.9),rgba(17,12,8,.98));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line-soft)}
.bottom-nav.show{display:grid}
.bottom-nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-faint);font-size:10.5px;font-weight:800}
.bottom-nav button i{font-style:normal;font-size:20px;filter:grayscale(1);opacity:.55;transition:.15s}
.bottom-nav button.active{color:var(--text)}
.bottom-nav button.active i{filter:none;opacity:1;transform:translateY(-1px)}
.bottom-nav button.active:before{content:"";position:absolute;top:0;left:32%;right:32%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nav-badge{position:absolute;top:7px;left:calc(50% + 7px);min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--accent);color:#fff;font-size:10px;font-weight:900;display:none;align-items:center;justify-content:center;font-style:normal;box-shadow:0 0 0 2px #1a130d}
.nav-badge.show{display:flex}

/* ---------- home ---------- */
.home-head{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 2px 2px}
.avatar{position:relative;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5a4430,#1d150e);display:flex;align-items:center;justify-content:center;font-size:25px;border:2px solid #f2a03d66;flex-shrink:0;box-shadow:0 0 22px #f2a03d22}
.lvl-badge{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;font-style:normal;color:#2a1600;background:linear-gradient(180deg,#ffe193,#e9a93b);padding:1px 7px;border-radius:99px;white-space:nowrap;border:2px solid var(--bg)}
.profile-main{flex:1;min-width:0}
.profile-name{font-weight:900;font-size:16px;display:flex;align-items:center;gap:6px;max-width:100%;text-align:left}
.profile-name span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-name .pen{font-size:11px;opacity:.45}
.title-chip{font-size:11px;color:var(--amber);margin-top:2px;font-weight:700}
.xp-bar{height:7px;border-radius:99px;background:#0d0906;margin-top:6px;overflow:hidden;border:1px solid var(--line-soft)}
.xp-bar i{display:block;height:100%;background:linear-gradient(90deg,#f2a03d,#f3c552);width:0;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xp-text{font-size:10px;color:var(--text-faint);margin-top:3px}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 2px 8px;flex-wrap:wrap}
.quick-strip{display:flex;gap:6px;flex-wrap:wrap;margin:0 2px 10px}
.qchip{font-size:11px;font-weight:800;color:var(--text-dim);background:var(--panel);border:1px solid var(--line-soft);padding:5px 9px;border-radius:99px;white-space:nowrap}
.qchip.hot{color:#ffb185;border-color:#ff8a5c55;background:#33190f}
.qchip.ad{color:#9ff0e3;border-color:#6fd8c866;background:#0f2826;cursor:pointer}
.ad-ov{position:absolute;inset:0;z-index:96;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:radial-gradient(circle at 50% 40%,#1d2b3a,#05070a 70%);text-align:center;animation:fadeOnly .2s ease both}
.ad-ov .ad-badge{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;font-size:11px;font-weight:900;padding:3px 8px;border-radius:6px;background:#ffd34d;color:#2a1a00;font-style:normal}
.ad-ov .ad-x{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;min-width:38px;height:38px;border-radius:99px;background:#ffffff1a;border:1px solid #ffffff33;color:#fff;font-weight:900;font-size:13px;padding:0 12px}
.ad-ov .ad-x:disabled{opacity:.6}
.ad-ov .ad-art{font-size:64px;animation:pop .5s ease both}
.ad-ov b{font-size:20px}
.ad-ov small{font-size:11.5px;color:#9fb3c8;max-width:280px;line-height:1.5}
.ad-ov .ad-bar{width:min(70vw,260px);height:5px;border-radius:9px;background:#ffffff1a;overflow:hidden}
.ad-ov .ad-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6fd8c8,#ffd34d)}

.rank-card{position:relative;overflow:hidden;width:100%;text-align:left;border-radius:22px;padding:16px;border:1px solid #f3c55255;background:radial-gradient(130% 120% at 100% 0%,#5b2a19 0%,#2d1d12 55%,#1c140d 100%);box-shadow:0 16px 40px #0007,inset 0 1px 0 #ffffff12;display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:center;color:var(--text)}
.rank-card:before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff14,transparent);animation:shine 3.4s ease-in-out infinite;pointer-events:none}
.rank-card:active{transform:scale(.988)}
.tier-emblem{--t1:#e0a170;--t2:#8a4f25;width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;background:radial-gradient(circle at 35% 28%,var(--t1),var(--t2));box-shadow:0 0 0 3px #00000055,0 0 26px color-mix(in srgb,var(--t1) 40%,transparent),inset 0 -6px 12px #0006;flex-shrink:0}
.tier-emblem.sm{width:40px;height:40px;font-size:19px;box-shadow:0 0 0 2px #00000055,inset 0 -4px 8px #0006}
.tier-emblem.lg{width:96px;height:96px;font-size:46px}
.rank-main{min-width:0}
.rank-kicker{font-size:10.5px;font-weight:900;letter-spacing:2px;color:var(--amber)}
.rank-name{font-size:22px;font-weight:900;letter-spacing:-.5px;margin-top:2px}
.rank-bar{height:8px;border-radius:99px;background:#00000055;overflow:hidden;margin-top:8px;border:1px solid #ffffff10}
.rank-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#f2a03d,#ff7d5f);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.rank-meta{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;color:var(--text-dim);margin-top:5px}
.rank-cta{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px;background:linear-gradient(180deg,#ff7d5f,#d6402a);color:#fff;font-weight:900;font-size:15px;box-shadow:0 8px 20px #e8553d44}
.rank-cta .cost{font-size:12px;padding:3px 9px;border-radius:99px;background:#00000033}
.rank-card.locked .rank-cta{background:var(--panel2);color:var(--text-faint);box-shadow:none}
.rank-card.locked .tier-emblem{filter:grayscale(1);opacity:.6}

.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mode-card{position:relative;overflow:hidden;min-height:122px;border-radius:18px;padding:14px 13px 12px;text-align:left;border:1px solid var(--line);background:linear-gradient(150deg,#30251a,#1d160f);display:flex;flex-direction:column;gap:3px;color:var(--text)}
.mode-card:active{transform:scale(.985)}
.mode-card:after{content:"";position:absolute;right:-18px;bottom:-18px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff22,#ffffff05 60%,transparent 70%)}
.mode-card .mc-ico{font-size:26px;line-height:1.1}
.mode-card b{font-size:15.5px;font-weight:900;margin-top:3px}
.mode-card span{font-size:11px;color:var(--text-dim);line-height:1.35}
.mode-card .mc-cost{margin-top:auto;padding-top:6px;font-size:11px;font-weight:900;color:var(--token)}
.mode-card .mc-cost.free{color:var(--good)}
.mode-card .mc-tag{position:absolute;top:10px;right:10px;font-size:9.5px;font-weight:900;padding:2px 7px;border-radius:99px;background:var(--accent);color:#fff;z-index:1}
.mode-card.locked{opacity:.55}
.mode-card.m-battle{background:linear-gradient(150deg,#3a2a17,#1f170f);border-color:#f2a03d55}
.mode-card.m-boss{background:linear-gradient(150deg,#4d1b13,#22120c);border-color:#e8553d66}
.mode-card.m-tag{background:linear-gradient(150deg,#173b31,#13201a);border-color:#6fd8c855}
.mode-card.m-practice{background:linear-gradient(150deg,#2a2a33,#18171c);border-color:#8a87a055}

.mission-list{display:flex;flex-direction:column;gap:8px}
.mission{display:flex;align-items:center;gap:11px;background:linear-gradient(150deg,#2a2118,#1b150f);border:1px solid var(--line-soft);border-radius:14px;padding:11px 12px}
.mission.done{border-color:#f3c55277;box-shadow:0 0 18px #f3c55214}
.mission.claimed{opacity:.5}
.m-ico{width:38px;height:38px;border-radius:11px;background:#140f0a;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.m-main{flex:1;min-width:0}
.m-name{font-size:12.5px;font-weight:800;line-height:1.3}
.m-bar{height:5px;border-radius:99px;background:#0d0906;margin-top:6px;overflow:hidden}
.m-bar i{display:block;height:100%;background:linear-gradient(90deg,#f2a03d,#f3c552);border-radius:99px;transition:width .5s ease}
.m-prog{font-size:10px;color:var(--text-faint);margin-top:3px}
.claim-btn{flex-shrink:0;min-width:72px;padding:8px 10px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--coin);font-weight:900;font-size:12px;text-align:center}
.claim-btn.ready{background:linear-gradient(180deg,#ffe193,#e9a93b);color:#2a1a00;border-color:#ffd16699;animation:pulseBtn 1.3s ease-in-out infinite}
.claim-btn.ok{color:var(--good);background:#16261c;border-color:#7ad39b44}
.ach .m-ico{filter:grayscale(1);opacity:.55}
.ach.reached .m-ico,.ach.claimed .m-ico{filter:none;opacity:1}
.ach.reached{border-color:#f3c55277}
.ach .m-bar i{background:linear-gradient(90deg,#ff7d5f,#f2a03d)}
.bonus-card{display:flex;align-items:center;gap:11px;border:1px dashed #f3c55266;background:#2e241055;border-radius:14px;padding:12px}
.bonus-card .m-main{font-size:11.5px;color:var(--text-dim)}
.bonus-card b{display:block;color:var(--coin);font-size:13.5px}

/* ---------- setup ---------- */
.field{margin-bottom:18px}
.field-label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--text-dim);margin-bottom:8px;font-weight:700}
.field-label small{font-size:11px;color:var(--text-faint);font-weight:600;text-align:right}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:10px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);font-size:20px}
.stepper button:disabled{opacity:.3}
.stepper .val{font-size:22px;font-weight:900;min-width:44px;text-align:center}
.dots-preview{display:flex;justify-content:center;gap:5px;margin-top:8px;flex-wrap:wrap}
.dots-preview i{width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 1px #ffffff33}
.map-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.map-chip{position:relative;border-radius:13px;border:1px solid var(--line-soft);background:var(--panel);padding:8px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-dim);font-size:12px;font-weight:800}
.map-chip svg{width:44px;height:44px}
.map-chip small{font-size:9.5px;color:var(--text-faint);font-weight:600}
.map-chip.active{border-color:var(--amber);background:#3a2a14;color:var(--gold)}
.map-chip.locked{opacity:.45}
.map-chip .lk{position:absolute;top:5px;right:6px;font-size:10px}
.rules{display:flex;flex-direction:column;gap:7px;margin:0}
.rules li{list-style:none;display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--text-dim);line-height:1.45}
.rules li i{font-style:normal;flex-shrink:0;width:22px;text-align:center}
.rules li b{color:var(--text)}
.info-card{border-radius:16px;border:1px solid var(--line-soft);background:linear-gradient(150deg,#2a2118,#1b150f);padding:14px;margin-bottom:14px}
.info-card.hero{display:flex;gap:14px;align-items:center}
.info-card .ic-main{flex:1;min-width:0}
.info-card .ic-title{font-size:18px;font-weight:900}
.info-card .ic-sub{font-size:12px;color:var(--text-dim);margin-top:3px;line-height:1.45}
.boss-face{width:72px;height:72px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:34px;background:radial-gradient(circle at 35% 28%,#ff9a7a,#7a1410 70%);box-shadow:0 0 0 3px #00000066,0 0 30px #e8553d66,inset 0 -8px 14px #0007}
.hp-pips{display:flex;gap:4px;margin-top:7px}
.hp-pips i{width:16px;height:7px;border-radius:3px;background:var(--accent);box-shadow:0 0 8px #e8553d88}
.hp-pips i.off{background:#3a2a20;box-shadow:none}
.rp-table{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.rp-table div{border-radius:10px;background:#0006;padding:7px 4px;text-align:center;font-size:10.5px;color:var(--text-faint)}
.rp-table b{display:block;font-size:14px;margin-top:2px}
.rp-table .up{color:var(--good)}.rp-table .dn{color:#ff8b78}
.lock-note{font-size:11px;color:var(--text-faint);margin-top:6px;white-space:pre-line}
.booster-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.booster{display:flex;align-items:center;gap:6px;text-align:left;padding:10px;border-radius:12px;border:1px solid var(--line-soft);background:var(--panel);font-size:12px;font-weight:700;color:var(--text-dim)}
.booster .b-ico{font-size:17px}
.booster small{margin-left:auto;font-weight:900;color:var(--text-faint)}
.booster.active{border-color:var(--amber);color:var(--gold);background:#3a2a14}
.booster.active small{color:var(--gold)}
.booster.empty{opacity:.45}
.player-list{display:flex;flex-direction:column;gap:8px}
.player-row{display:flex;align-items:center;gap:10px;border-radius:12px;padding:9px 12px;background:var(--panel);border:1px solid var(--line-soft)}
.dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 1px #ffffff40}
.player-row .pname{flex:1;font-size:13.5px;font-weight:700}
.switch{width:44px;height:25px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);position:relative;flex-shrink:0}
.switch i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--text-faint);transition:.15s}
.switch.on{background:#3a2a14;border-color:var(--amber)}
.switch.on i{left:21px;background:var(--gold)}
.sw-label{font-size:10.5px;color:var(--text-faint);width:32px;text-align:right}
.setup-foot{padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,#15100bf0 30%);border-top:1px solid #ffffff08}
.reward-preview{display:flex;gap:6px;justify-content:center;margin:0 0 9px;flex-wrap:wrap}
.reward-preview:empty{display:none}
.reward-preview span{font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line-soft)}
.reward-preview .c{color:var(--coin)}.reward-preview .x{color:var(--amber)}.reward-preview .t{color:var(--token)}.reward-preview .r{color:var(--good)}

/* ---------- shop ---------- */
.deal-head{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 8px}
.deal-head b{font-size:14.5px;font-weight:900}
.deal-head small{font-size:11px;color:var(--text-faint)}
.deal-strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(132px,40%);gap:10px;overflow-x:auto;margin:0 -16px 8px;padding:2px 16px 6px;scrollbar-width:none;touch-action:pan-x}
.deal-strip::-webkit-scrollbar{display:none}
.deal-card{position:relative;border-radius:16px;padding:12px 10px 10px;border:1px solid #f3c55255;background:linear-gradient(160deg,#432d12,#1f170f);display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.deal-card.sold{opacity:.5}
.deal-off{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:900;padding:2px 7px;border-radius:99px}
.deal-card .nm{font-size:12.5px;font-weight:800;line-height:1.2;min-height:2.4em;display:flex;align-items:center}
.deal-card .kind{font-size:9.5px;color:var(--text-faint);font-weight:700}
.price{font-weight:900;color:var(--coin);font-size:12.5px;white-space:nowrap}
.price s{color:var(--text-faint);font-weight:600;margin-right:4px;font-size:.85em}
.sub-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sub-row .scroll-row{flex:1;margin-bottom:0}
.filter-tg{flex-shrink:0;font-size:11px;font-weight:800;color:var(--text-faint);padding:7px 10px;border-radius:99px;border:1px solid var(--line-soft);background:var(--panel)}
.filter-tg.on{color:var(--gold);border-color:var(--amber);background:#3a2a14}
.collect{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--text-faint);margin:0 2px 10px}
.collect .m-bar{flex:1;margin:0}
.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.shop-card{position:relative;border-radius:16px;padding:10px 10px 11px;border:1px solid var(--line-soft);background:linear-gradient(160deg,#2a2118,#1b150f);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--text)}
.shop-card:active{transform:scale(.98)}
.shop-card.eq{border-color:var(--amber);box-shadow:0 0 0 1px #f2a03d44,0 0 22px #f2a03d18}
.prev{width:100%;height:76px;border-radius:12px;background:radial-gradient(circle at 50% 42%,#e9c189 0%,#c08a4a 100%);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px #00000033,inset 0 -10px 20px #0000002a;overflow:hidden;font-size:34px}
.prev.dark{background:radial-gradient(circle at 50% 40%,#3a2c20,#17110c)}
.prev img{width:56px;height:56px}
.prev.big{height:150px;font-size:64px}
.prev.big img{width:110px;height:110px}
.shop-card .nm{font-size:13px;font-weight:800;line-height:1.2}
.shop-card .st{font-size:11.5px;font-weight:900;color:var(--coin)}
.shop-card .st.own{color:var(--text-faint)}
.shop-card .st.eqd{color:var(--amber)}
.shop-card .tagx{position:absolute;top:8px;right:8px;font-size:9.5px;font-weight:900;padding:2px 6px;border-radius:99px;background:#000a;color:var(--gold)}
.list{display:flex;flex-direction:column;gap:10px}
.up-card{display:flex;gap:12px;align-items:center;border:1px solid var(--line-soft);background:linear-gradient(150deg,#2a2118,#1b150f);border-radius:16px;padding:12px 12px 12px 13px}
.up-card.special{border-color:#f3c55277;background:linear-gradient(150deg,#46301a,#1f170f)}
.up-ico{width:46px;height:46px;border-radius:13px;background:#140f0a;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.up-main{flex:1;min-width:0}
.up-title{font-size:14px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.up-lv{font-size:10.5px;color:var(--amber);border:1px solid #f2a03d55;border-radius:20px;padding:1px 7px;font-weight:800}
.up-desc{font-size:11.5px;color:var(--text-dim);line-height:1.45;margin-top:3px}
.up-eff{font-size:11px;color:var(--gold);margin-top:4px;font-weight:700}
.pips{display:flex;gap:3px;margin-top:7px}
.pips i{flex:1;height:4px;border-radius:3px;background:#0d0906;border:1px solid var(--line-soft)}
.pips i.on{background:linear-gradient(90deg,#f2a03d,#f3c552);border-color:transparent}
.buy-btn{flex-shrink:0;min-width:80px;padding:9px 8px;border-radius:12px;border:1px solid #ff8a6a66;background:linear-gradient(180deg,#ff7d5f,#d6402a);color:#fff;font-weight:900;font-size:12.5px;text-align:center;line-height:1.3}
.buy-btn.locked{background:var(--panel2);border-color:var(--line);color:var(--text-faint)}
.buy-btn.max{background:#16261c;border-color:#7ad39b44;color:var(--good)}
.buy-btn.jade{background:linear-gradient(180deg,#8ff0e0,#3fb5a4);color:#04201c;border-color:#6fd8c899}
.token-hero{display:flex;align-items:center;gap:14px;border-radius:18px;padding:14px;margin-bottom:12px;border:1px solid #6fd8c855;background:linear-gradient(150deg,#123a34,#11201c)}
.token-big{font-size:40px}
.token-hero b{font-size:22px;color:var(--token)}
.token-hero small{display:block;font-size:11.5px;color:#a9cfc8;margin-top:3px;line-height:1.45}

/* ---------- sheet ---------- */
.sheet-wrap{position:absolute;inset:0;z-index:70;display:none}
.sheet-wrap.show{display:block}
.sheet-back{position:absolute;inset:0;background:rgba(6,4,2,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fadeOnly .2s ease}
.sheet-card{position:absolute;left:0;right:0;bottom:0;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#2e231a,#1a130d);border-top:1px solid var(--line);animation:sheetUp .26s cubic-bezier(.2,.9,.3,1);max-height:88%;overflow-y:auto;touch-action:pan-y}
.sheet-grip{width:40px;height:4px;border-radius:9px;background:#ffffff26;margin:0 auto 12px}
.sheet-title{font-size:20px;font-weight:900;text-align:center;margin-top:12px}
.sheet-sub{font-size:12px;color:var(--text-dim);text-align:center;margin-top:4px;line-height:1.5;white-space:pre-line}
.sheet-actions{display:flex;gap:8px;margin-top:16px}
.sheet-actions .btn{flex:1}

/* ---------- profile / settings ---------- */
.profile-hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:6px 0 4px}
.profile-hero .avatar{width:84px;height:84px;font-size:40px}
.profile-hero .nm{font-size:21px;font-weight:900;display:flex;align-items:center;gap:6px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-cell{border-radius:13px;padding:10px 4px;text-align:center;background:var(--panel);border:1px solid var(--line-soft)}
.stat-num{font-size:17px;font-weight:900}
.stat-label{font-size:10px;color:var(--text-faint);margin-top:2px}
.mode-stats{display:flex;flex-direction:column;gap:7px}
.ms-row{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;background:var(--panel);border:1px solid var(--line-soft);font-size:12.5px}
.ms-row .ms-ico{font-size:18px;width:24px;text-align:center}
.ms-row .ms-name{flex:1;font-weight:800}
.ms-row .ms-val{color:var(--text-dim);font-weight:700;text-align:right}
.set-group{border-radius:16px;border:1px solid var(--line-soft);background:var(--panel);overflow:hidden}
.set-row{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid #ffffff08;font-size:13.5px;font-weight:700;width:100%;text-align:left}
.set-row:last-child{border-bottom:none}
.set-row .sr-ico{width:22px;text-align:center}
.set-row .sr-main{flex:1}
.set-row .sr-val{color:var(--text-faint);font-size:12px}
.set-row.danger{color:#ff8b78}
.lang-row{display:flex;gap:5px}
.lang-row button{font-size:11.5px;color:var(--text-faint);padding:5px 9px;border-radius:20px;border:1px solid transparent;font-weight:700}
.lang-row button.active{color:var(--gold);border-color:#f2a03d66;background:#3a2a1466}

/* ---------- game ---------- */
#screen-game{background:radial-gradient(120% 70% at 50% 45%,#2a1d12 0%,#150f0a 58%,#0b0806 100%)}
canvas#board{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud-top{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 10px 0;z-index:5;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.hud-status{display:flex;align-items:center;gap:6px}
.hud-status .grow{flex:1}
.icon-btn{pointer-events:auto;background:rgba(24,18,12,.9);border:1px solid var(--line);color:var(--text-dim);min-width:34px;height:34px;border-radius:10px;font-size:14px;padding:0 8px;font-weight:800}
.icon-btn.on{color:var(--gold);border-color:#f2a03d77}
.hud-toggle{pointer-events:auto;background:rgba(24,18,12,.92);border:1px solid var(--line);color:var(--text-dim);height:34px;padding:0 10px;border-radius:10px;font-size:10.5px;font-weight:800;white-space:nowrap}
.mode-pill{font-size:10.5px;font-weight:800;color:var(--text-dim);background:rgba(24,18,12,.9);border:1px solid var(--line);padding:0 9px;height:34px;display:flex;align-items:center;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mode-bar{display:none;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:rgba(24,18,12,.92);border:1px solid var(--line);font-size:12px;font-weight:800}
.mode-bar.show{display:flex}
.mode-bar.boss{border-color:#e8553d88;background:linear-gradient(90deg,rgba(77,27,19,.94),rgba(24,18,12,.92))}
.mode-bar.tag{border-color:#6fd8c877}
.mode-bar .mb-main{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode-bar .mb-side{color:var(--text-dim);white-space:nowrap}
.hud-players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:2px;max-height:150px;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;align-content:start;pointer-events:auto}
.hud-players.many{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.hud-players.is-hidden{display:none}
.hud-chip{min-width:0;display:flex;align-items:center;gap:6px;background:rgba(24,18,12,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #3a2e22;border-radius:11px;padding:5px 8px 5px 7px;opacity:.6;transition:opacity .2s,border-color .2s}
.hud-chip.turn{opacity:1;border-color:var(--amber);box-shadow:0 0 0 1px #f2a03d55,0 0 16px #f2a03d22}
.hud-chip.me .nm{color:#fff}
.hud-chip.dead{opacity:.22;filter:grayscale(1)}
.hud-chip.it{border-color:var(--accent)!important;opacity:1;box-shadow:0 0 14px #e8553d44}
.hud-chip .dot{width:11px;height:11px}
.hud-chip .nm{font-size:11px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud-chip .cnt{font-size:9.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-chip>div:last-child{min-width:0}
.turn-banner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);z-index:6;background:rgba(20,15,10,.94);border:1px solid var(--amber);color:var(--gold);font-weight:900;font-size:15px;padding:11px 22px;border-radius:12px;opacity:0;transition:.22s;pointer-events:none;white-space:nowrap;letter-spacing:.3px;box-shadow:0 10px 40px #0009;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.turn-banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.turn-banner.mine{background:linear-gradient(180deg,#ff7d5f,#d6402a);color:#fff;border-color:transparent}
.hud-bottom{position:absolute;left:0;right:0;bottom:0;padding:0 16px calc(16px + env(safe-area-inset-bottom));z-index:5;display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none}
.power-wrap{width:100%;max-width:300px;display:flex;align-items:center;gap:8px;opacity:.35;transition:.15s}
.power-wrap.show{opacity:1}
.power-wrap.off .turn-timer{opacity:.2}
.power-bar{flex:1;height:9px;border-radius:8px;background:#0d0906;overflow:hidden;border:1px solid var(--line-soft)}
.power-fill{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#f3c552,#f2a03d,#e8553d)}
.power-pct{font-size:11px;color:var(--text-dim);min-width:34px;text-align:right;font-weight:800}
.hint{font-size:11.5px;color:var(--text-faint);text-align:center;font-weight:600;min-height:15px}
.turn-timer{width:36px;height:36px}
.minimap-wrap{position:absolute;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:5;display:none;flex-direction:column;align-items:flex-end;gap:6px}
.minimap-wrap.show{display:flex}
#minimap{width:104px;height:104px;border-radius:14px;border:1px solid var(--line);background:rgba(20,15,10,.85);pointer-events:none}
.toast-stack{position:absolute;top:calc(120px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:85;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%}
.toast-stack.low{top:auto;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));flex-direction:column-reverse}
.toast{background:rgba(26,20,14,.97);border:1px solid var(--line);padding:9px 15px;border-radius:12px;font-size:12.5px;font-weight:800;text-align:center;animation:fadeIn .2s ease both;box-shadow:0 8px 24px #0007;max-width:100%}
.toast.gold{border-color:#f3c55288;color:#ffe3a0}
.toast.good{border-color:#7ad39b88;color:#c4f5d6}
.toast.bad{border-color:#ff8b7888;color:#ffc4b8}

/* ---------- result ---------- */
.result-content{display:flex;flex-direction:column;align-items:center;padding-top:calc(24px + env(safe-area-inset-top))}
.result-hero{text-align:center;margin-bottom:14px}
.result-medal{font-size:64px;animation:pop .5s ease both}
.result-title{font-size:30px;font-weight:900;letter-spacing:-.6px;margin-top:4px}
.result-title.win{background:linear-gradient(180deg,#fffaf0,#f3c552);-webkit-background-clip:text;background-clip:text;color:transparent}
.result-title.lose{color:#ff9a86}
.result-sub{font-size:13px;color:var(--text-dim);margin-top:4px}
.streak-chip{display:inline-block;margin-top:10px;font-size:12px;font-weight:800;padding:5px 12px;border-radius:99px;color:#ffb185;background:#33190f;border:1px solid #ff8a5c55}
.streak-chip:empty{display:none}
.result-card{width:100%;max-width:400px;background:linear-gradient(150deg,#2a2118,#1b150f);border:1px solid var(--line-soft);border-radius:18px;padding:6px 16px;margin-bottom:10px}
.result-card:empty{display:none}
.rank-result{width:100%;max-width:400px;display:flex;align-items:center;gap:14px;border-radius:18px;padding:14px 16px;margin-bottom:10px;border:1px solid #f3c55255;background:radial-gradient(130% 120% at 100% 0%,#5b2a19 0%,#2d1d12 60%,#1c140d 100%)}
.rank-result .rr-main{flex:1;min-width:0}
.rank-result .rr-delta{font-size:24px;font-weight:900}
.rank-result .rr-delta.up{color:var(--good)}.rank-result .rr-delta.dn{color:#ff8b78}
.place-list{width:100%;max-width:400px;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.place-row{display:flex;align-items:center;gap:10px;border-radius:12px;padding:8px 12px;background:var(--panel);border:1px solid var(--line-soft);font-size:13px;font-weight:700}
.place-row.me{border-color:var(--amber);background:#3a2a14}
.place-row .pl{width:26px;font-weight:900;color:var(--gold)}
.place-row .pv{margin-left:auto;color:var(--text-dim);font-size:12px}
.rw-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:13px;color:var(--text-dim);border-bottom:1px solid #ffffff0a;animation:fadeIn .3s ease both}
.rw-row b{color:var(--coin)}
.rw-row.neg b{color:#ff8b78}
.rw-row.tok b{color:var(--token)}
.rw-row.total{border-bottom:none;font-size:15px;color:var(--text);font-weight:900}
.rw-row.total b{font-size:19px}
.xp-card{width:100%;max-width:400px;background:linear-gradient(150deg,#2a2118,#1b150f);border:1px solid var(--line-soft);border-radius:18px;padding:13px 16px;margin-bottom:10px}
.xp-card .xp-head{display:flex;justify-content:space-between;font-size:13px;font-weight:900}
.xp-card .xp-head span{color:var(--amber)}
.result-actions{width:100%;max-width:400px;margin-top:6px;display:flex;flex-direction:column;gap:8px}

/* ---------- tutorial / coach ---------- */
.tut{position:absolute;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:22px;background:radial-gradient(circle at 50% 38%,rgba(242,160,61,.14),rgba(6,4,2,.9) 62%);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tut.show{display:flex;animation:fadeIn .25s ease both}
.tut-card{width:min(94%,360px);padding:22px 20px 18px;border-radius:26px;border:1px solid #f2a03d66;background:linear-gradient(160deg,rgba(46,35,26,.99),rgba(20,15,10,.99));box-shadow:0 24px 80px #000b;text-align:center}
.tut-card.slide{animation:fadeIn .3s ease both}
.tut-art{height:150px;border-radius:18px;background:#140f0a;border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
.tut-art svg{width:100%;height:100%}
.tut-title{font-size:21px;font-weight:900;margin-top:16px;letter-spacing:-.4px}
.tut-body{font-size:13.5px;color:var(--text-dim);line-height:1.6;margin-top:8px;white-space:pre-line;min-height:64px}
.tut-dots{display:flex;justify-content:center;gap:6px;margin:14px 0 4px}
.tut-dots i{width:7px;height:7px;border-radius:99px;background:#4a3a2b;transition:.2s}
.tut-dots i.on{width:22px;background:var(--accent)}
.tut-actions{display:flex;gap:8px;margin-top:14px}
.tut-actions .btn{flex:1}
.tut-actions .btn.primary{flex:1.6}
.ob-card{max-height:92%;display:flex;flex-direction:column}
.ob-globe{font-size:46px;line-height:1.1}
.ob-langs{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.ob-langs button{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font-size:16px;font-weight:900;text-align:left}
.ob-langs button i{font-style:normal;font-size:16px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#140f0a;border:1px solid var(--line);flex-shrink:0}
.ob-langs button.active i{border-color:var(--amber)}
.ob-langs button.active{border-color:var(--amber);background:#3a2a14;color:var(--gold);box-shadow:0 0 0 1px #f2a03d55}
.ob-policy{margin-top:12px;flex:1;min-height:120px;max-height:46vh;overflow-y:auto;text-align:left;padding:12px 14px;border-radius:12px;background:#0d0906;border:1px solid var(--line-soft);font-size:11.5px;line-height:1.6;color:var(--text-dim);touch-action:pan-y;user-select:text;-webkit-user-select:text}
.ob-policy h4{margin:10px 0 3px;font-size:12.5px;color:var(--text)}
.ob-policy h4:first-child{margin-top:0}
.ob-policy p{margin:0}
.ob-check{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13px;font-weight:800;text-align:left;cursor:pointer}
.ob-check input{width:20px;height:20px;accent-color:#e8553d;flex-shrink:0}
.adm-grid{display:grid;grid-template-columns:auto 1fr;gap:9px 10px;align-items:center;padding:13px 14px}
.adm-grid label{font-size:13px;font-weight:800}
.adm-grid input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#120d09;color:var(--text);font-size:15px;font-weight:800;outline:none;user-select:text;-webkit-user-select:text}
.adm-grid input:focus{border-color:var(--amber)}
.coach{position:absolute;left:16px;right:16px;bottom:calc(100px + env(safe-area-inset-bottom));z-index:7;display:none;padding:12px 14px;border-radius:14px;background:rgba(46,30,14,.95);border:1px solid #f2a03d88;color:#ffecd0;font-size:13px;font-weight:800;line-height:1.5;text-align:center;box-shadow:0 10px 30px #0009;pointer-events:none}
.coach.show{display:block;animation:fadeIn .25s ease both}

/* ---------- modal ---------- */
.modal{position:absolute;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 42%,rgba(242,160,61,.1),rgba(6,4,2,.84) 60%);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal.show{display:flex;animation:fadeOnly .2s ease both}
.modal-card{width:min(92%,340px);padding:26px 20px 20px;border-radius:24px;border:1px solid #f2a03d66;background:linear-gradient(160deg,rgba(46,35,26,.99),rgba(20,15,10,.99));box-shadow:0 20px 70px #000a;text-align:center;animation:pop .3s ease both}
.modal-card .mo-ico{font-size:54px;line-height:1.1}
.modal-card .mo-title{font-size:21px;font-weight:900;margin-top:6px}
.modal-card .mo-body{font-size:13px;color:var(--text-dim);margin-top:6px;line-height:1.55;white-space:pre-line}
.modal-card .mo-reward{display:inline-block;margin-top:14px;font-size:20px;font-weight:900;color:var(--coin);padding:8px 18px;border-radius:99px;background:#2e2410;border:1px solid #f6c94e55}
.modal-card .mo-reward:empty{display:none}
.modal-card input{width:100%;margin-top:14px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#120d09;color:var(--text);font-size:15px;font-weight:700;outline:none;user-select:text;-webkit-user-select:text}
.modal-card input:focus{border-color:var(--amber)}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.modal-actions .btn{flex:1}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#2a0705}

/* ---------- 꾸미기 등급 (회색 · 파랑 · 빨강 · 보라 · 금색 · 무지개) ---------- */
@property --rb{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes rbspin{to{--rb:360deg}}
@keyframes goldShine{0%,50%{transform:translateX(-120%) skewX(-18deg)}100%{transform:translateX(220%) skewX(-18deg)}}
.r0{--rc:#a3aab3;border-color:#7d848c!important}
.r1{--rc:#5fa2ff;border-color:#3d8bff!important;box-shadow:0 0 0 1px #3d8bff55,0 0 14px #3d8bff22}
.r2{--rc:#ff6b6b;border-color:#ff4b4b!important;box-shadow:0 0 0 1px #ff4b4b55,0 0 16px #ff4b4b2a}
.r3{--rc:#c58bff;border-color:#b469ff!important;box-shadow:0 0 0 1px #b469ff66,0 0 20px #b469ff33}
.r4{--rc:#ffd34d;border-color:#ffc933!important;box-shadow:0 0 0 1px #ffc93399,0 0 24px #ffc93347;overflow:hidden}
.r4:after{content:"";position:absolute;top:0;left:0;width:45%;height:100%;background:linear-gradient(90deg,transparent,#fff3c455,transparent);animation:goldShine 2.6s ease-in-out infinite;pointer-events:none}
.r5{--rc:#fff;border:2px solid transparent!important;background:linear-gradient(160deg,#2c2219,#1b150f) padding-box,conic-gradient(from var(--rb),#ff5c7a,#ffd166,#7ee08a,#55bfff,#c084fc,#ff5c7a) border-box!important;animation:rbspin 2.8s linear infinite;box-shadow:0 0 22px #c084fc44,0 0 34px #55bfff22}
.r1 .prev{box-shadow:inset 0 0 0 1px #3d8bff44,inset 0 -10px 22px #3d8bff22}
.r2 .prev{box-shadow:inset 0 0 0 1px #ff4b4b44,inset 0 -10px 22px #ff4b4b22}
.r3 .prev{box-shadow:inset 0 0 0 1px #b469ff55,inset 0 -10px 24px #b469ff2a}
.r4 .prev{box-shadow:inset 0 0 0 1px #ffc93366,inset 0 -12px 26px #ffc93333}
.r5 .prev{box-shadow:inset 0 0 0 1px #ffffff44,inset 0 -12px 28px #c084fc3a}
.rar-tag{position:absolute;top:7px;left:7px;z-index:2;font-size:9px;font-weight:900;padding:2px 7px;border-radius:99px;background:#000b;color:var(--rc);letter-spacing:.3px;box-shadow:0 0 0 1px color-mix(in srgb,var(--rc) 45%,transparent)}
.r5 .rar-tag{background:linear-gradient(90deg,#ff5c7a,#ffd166,#7ee08a,#55bfff,#c084fc);color:#1b1208}
.pw-mark{position:absolute;bottom:7px;right:8px;z-index:2;font-size:13px;filter:drop-shadow(0 0 6px var(--rc))}
.shop-card.eq{outline:2px solid #f2a03d;outline-offset:2px}
.deal-card .deal-off{z-index:3;top:auto;bottom:8px;left:8px}
.rar-line{display:flex;justify-content:center;margin-top:10px}
.rar-line span{position:relative;display:inline-block;overflow:hidden;font-size:11px;font-weight:900;padding:4px 12px;border-radius:99px;border:1px solid;color:var(--rc);border-color:var(--rc);background:#0006}
.pw-box{position:relative;margin-top:12px;border-radius:14px;border:1px solid;padding:11px 12px;text-align:left;background:#0005}
.pw-box b{display:block;font-size:13.5px;color:var(--rc)}
.pw-box span{display:block;font-size:12px;color:var(--text-dim);margin-top:3px;line-height:1.45}
.pw-box small{display:block;font-size:10.5px;color:var(--text-faint);margin-top:4px}
.prev.big{position:relative}

/* ---------- 게임 내 초능력 버튼 · 3D 조준 ---------- */
.pw-row{display:none;gap:7px;justify-content:center;flex-wrap:wrap;pointer-events:auto;max-width:100%}
.pw-row.show{display:flex}
.pw-btn{position:relative;display:flex;align-items:center;gap:5px;height:38px;padding:0 11px 0 8px;border-radius:12px;background:rgba(24,18,12,.92);border:1.5px solid;font-size:11px;font-weight:900;color:var(--text);box-shadow:0 6px 18px #0008}
.pw-btn i{font-style:normal;font-size:17px}
.pw-btn small{font-size:9.5px;color:var(--text-faint);font-weight:800}
.pw-btn.armed{background:linear-gradient(180deg,#ffe193,#e9a93b);color:#2a1a00;animation:pulseBtn 1s ease-in-out infinite}
.pw-btn.armed small{color:#5a3d00}
.pw-btn.used{opacity:.32;filter:grayscale(.8)}
.pw-btn.r5{background:linear-gradient(180deg,rgba(40,30,22,.96),rgba(24,18,12,.96)) padding-box,conic-gradient(from var(--rb),#ff5c7a,#ffd166,#7ee08a,#55bfff,#c084fc,#ff5c7a) border-box!important}
.pw-btn.r5.armed{background:linear-gradient(180deg,#fff6d8,#ffd166) padding-box,conic-gradient(from var(--rb),#ff5c7a,#ffd166,#7ee08a,#55bfff,#c084fc,#ff5c7a) border-box!important}
#board3d{position:absolute;inset:0;width:100%;height:100%;display:block;visibility:hidden;pointer-events:none}
.cam-btn{display:none}
.cam-btn.show{display:inline-flex;align-items:center;justify-content:center}
.aim3d-tip{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 130px);transform:translateX(-50%);z-index:5;pointer-events:none;display:none;flex-direction:column;align-items:center;gap:6px;opacity:.95}
.aim3d-tip.show{display:flex;animation:fadeIn .3s ease both}
.aim3d-tip .sw{font-size:30px;animation:swipeLR 1.6s ease-in-out infinite}
.aim3d-tip .pl{font-size:26px;animation:pullDown 1.6s ease-in-out infinite .8s}
.aim3d-tip span{font-size:11.5px;font-weight:900;color:#ffecd0;background:rgba(20,15,10,.8);padding:5px 11px;border-radius:99px;border:1px solid #f2a03d66;white-space:nowrap}
@keyframes swipeLR{0%,100%{transform:translateX(-26px)}50%{transform:translateX(26px)}}
@keyframes pullDown{0%,100%{transform:translateY(-8px);opacity:.4}50%{transform:translateY(16px);opacity:1}}
.turn-banner{background:linear-gradient(180deg,rgba(40,28,16,.96),rgba(18,13,9,.96));box-shadow:0 10px 40px #0009,0 0 0 1px #ffffff10 inset,0 0 30px #f2a03d33;font-size:16px;letter-spacing:.6px}
.turn-banner.mine{background:linear-gradient(180deg,#ff8a66,#d6402a);box-shadow:0 12px 40px #e8553d66,inset 0 1px 0 #ffffff55}
.turn-banner.big{font-size:24px;padding:14px 30px}
.mode-card.m-janggi{grid-column:1/-1;min-height:100px;background:radial-gradient(120% 140% at 100% 0%,#5a2d18 0%,#2a1c12 55%,#1a130d 100%);border-color:#f3c55266;flex-direction:row;align-items:center;gap:14px}
.mode-card.m-janggi .jg-art{display:flex;gap:4px;flex-shrink:0}
.mode-card.m-janggi .jg-txt{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.mode-card.m-janggi .mc-cost{margin-top:4px;padding-top:0}
.jg-pc{width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-family:"Noto Serif KR","Noto Serif CJK KR","Batang","BatangChe","SimSun","Songti SC",serif;font-weight:900;font-size:20px;background:linear-gradient(160deg,#fbecc8,#d7b57b);clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);box-shadow:inset 0 -3px 6px #0003}
.jg-pc.cho{color:#12784a}.jg-pc.han{color:#c0261c}
.jg-pc.big{width:46px;height:46px;font-size:25px}
.hero-jg{display:flex;gap:5px;flex-shrink:0;align-items:center}
</style>
</head>
<body><div id="app">

    <div class="brand"><i class="brand-stone"></i><span class="brand-word">알까고</span><span class="seal">까</span></div>

<!-- ================= HOME ================= -->
<section class="screen tab" id="screen-home"><div class="content">
  <header class="home-head">
    <button class="avatar" id="homeAvatar" aria-label="profile"><span id="avatarIco">🌱</span><i class="lvl-badge" id="lvlBadge">Lv.1</i></button>
    <div class="profile-main">
      <button class="profile-name" id="profileName"><span id="profileNameText"></span><span class="pen">✎</span></button>

      <div class="xp-text" id="xpText"></div>
    </div>
    <button class="icon-round" data-open-settings aria-label="settings">⚙️</button>
  </header>
  <div class="brand-row">
    <h1 class="brand"><i class="brand-stone"></i><span class="brand-word">알까고</span><span class="seal">까</span></h1>
    <div class="wallet" data-wallet></div>
  </div>
  <div class="quick-strip" id="quickStrip"></div>

<!-- ================= SHOP ================= -->

<!-- ================= GAME ================= -->
<section class="screen" id="screen-game">
  <canvas id="board3d"></canvas>
  <canvas id="board"></canvas>
  <div class="hud-top" id="hudTop">
    <div class="hud-status">

const Sound={

 /* 신호 흐름: 음악 → 덕킹(효과음이 날 때 잠깐 줄어듦) → 마스터 · 효과음 → 컴프레서(펀치감) → 마스터 → 리미터 */
 init(){
  if(this.ctx)return;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{this.ctx=new AC()}catch(e){return}
  const c=this.ctx;
  this.limiter=c.createDynamicsCompressor();this.limiter.threshold.value=-4;this.limiter.knee.value=3;this.limiter.ratio.value=14;this.limiter.attack.value=.002;this.limiter.release.value=.18;this.limiter.connect(c.destination);
  this.master=c.createGain();this.master.gain.value=.9;this.master.connect(this.limiter);
  this.duckG=c.createGain();this.duckG.connect(this.master);
  this.musicGain=c.createGain();this.musicGain.gain.value=0;this.musicGain.connect(this.duckG);
  /* 홀 잔향 (음악 전용) */
  this.rev=c.createConvolver();this.rev.buffer=this.makeIR(2.6,2.4);
  const revOut=c.createGain();revOut.gain.value=.85;this.rev.connect(revOut);revOut.connect(this.musicGain);
  this.padBus=c.createGain();this.padBus.connect(this.musicGain);const ps=c.createGain();ps.gain.value=.55;this.padBus.connect(ps);ps.connect(this.rev);
  this.leadBus=c.createGain();this.leadBus.connect(this.musicGain);const ls=c.createGain();ls.gain.value=.6;this.leadBus.connect(ls);ls.connect(this.rev);
  const dl=c.createDelay(1),fb=c.createGain(),wet=c.createGain();dl.delayTime.value=.45;fb.gain.value=.25;wet.gain.value=.18;
  this.leadBus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(this.musicGain);
  this.drumBus=c.createGain();this.drumBus.connect(this.musicGain);const ds=c.createGain();ds.gain.value=.25;this.drumBus.connect(ds);ds.connect(this.rev);
  /* 효과음: 빠른 컴프레서로 단단하게 → 음악 위로 또렷하게 */
  this.sfxGain=c.createGain();this.sfxGain.gain.value=.85;
  this.sfxComp=c.createDynamicsCompressor();this.sfxComp.threshold.value=-22;this.sfxComp.knee.value=6;this.sfxComp.ratio.value=5;this.sfxComp.attack.value=.001;this.sfxComp.release.value=.09;
  const mk=c.createGain();mk.gain.value=1.5;this.sfxGain.connect(this.sfxComp);this.sfxComp.connect(mk);mk.connect(this.master);
  const len=c.sampleRate*2,nb=c.createBuffer(1,len,c.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<len;i++)nd[i]=Math.random()*2-1;this.noiseBuf=nb;
  this.MEL=this.DMEL.map(b=>{const a=b.split(" "),out=[];a.forEach((x,i)=>{if(x==="."||x==="_")return out.push(null);let h=1;while(a[i+h]===".")h++;out.push({n:+x,h})});return out});
 },
 makeIR(sec,decay){
  const c=this.ctx,len=Math.floor(c.sampleRate*sec),b=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let lp=0;for(let i=0;i<len;i++){lp=lp*.55+(Math.random()*2-1)*.45;d[i]=lp*Math.pow(1-i/len,decay)}}
  return b;
 },

 /* 범용 음원: 파형 + (필터 스윕) + 엔벨로프 + (비브라토 · 포르타멘토) */

  const osc=c.createOscillator(),g=c.createGain();osc.type=o.type||"sawtooth";

  if(o.sus){g.gain.setValueAtTime(G,t+Math.max(a,dur-o.sus));g.gain.linearRampToValueAtTime(.0001,t+dur)}

  m[set.own]=Array.isArray(a[set.own])?[...new Set(a[set.own].filter(id=>set.list.some(s=>s.id===id)))]:[];
  if(!m[set.own].includes(free))m[set.own].unshift(free);
  m[set.eq]=m[set.own].includes(a[set.eq])?a[set.eq]:free;
 }
 BOOSTERS.forEach(it=>{m.items[it.id]=Math.floor(clamp(num(a.items?.[it.id]),0,999))});
 MAP_ORDER.forEach(k=>{m.mapWins[k]=Math.floor(Math.max(0,num(a.mapWins?.[k])))});
 m.ach=boolMap(a.ach);m.achSeen=boolMap(a.achSeen);
 if(isObj(a.daily)&&typeof a.daily.date==="string"&&Array.isArray(a.daily.list)){
  const list=a.daily.list.filter(x=>isObj(x)&&MISSION_POOL.some(p=>p.id===x.id)).map(x=>({id:x.id,p:Math.floor(Math.max(0,num(x.p))),c:!!x.c}));
  if(list.length===3)m.daily={date:a.daily.date,list,bonus:!!a.daily.bonus};
 }
 if(isObj(a.rank)){
  const r=a.rank;
  m.rank={rp:Math.floor(Math.max(0,num(r.rp))),season:/^\d{4}-\d{2}$/.test(r.season)?r.season:seasonStr(),peak:Math.floor(clamp(num(r.peak),0,GM_TIER)),
   best:Math.floor(clamp(num(r.best),0,GM_TIER)),games:Math.floor(Math.max(0,num(r.games))),firsts:Math.floor(Math.max(0,num(r.firsts))),streak:Math.floor(Math.max(0,num(r.streak)))};
 }
 if(isObj(a.boss))m.boss={level:Math.floor(clamp(num(a.boss.level,1),1,BOSS_MAX)),wins:Math.floor(Math.max(0,num(a.boss.wins)))};
 if(isObj(a.modeStats))STAT_MODES.forEach(k=>{const s=a.modeStats[k];if(isObj(s))m.modeStats[k]={g:Math.floor(Math.max(0,num(s.g))),w:Math.floor(Math.max(0,num(s.w)))}});
 if(isObj(a.deals)&&typeof a.deals.date==="string"&&Array.isArray(a.deals.list))m.deals={date:a.deals.date,list:a.deals.list.filter(x=>typeof x==="string").slice(0,DEAL_COUNT)};

function earn(n){n=Math.max(0,Math.round(n));acc.coins+=n;acc.totalEarned+=n;return n}
function spend(c){if(!(c>=0)||acc.coins<c)return false;acc.coins-=c;acc.totalSpent+=c;save();return true}

let ptAnchor=Date.now();

/* 대전 토큰 — 최대 5개까지 15분마다 1개씩 충전 (구매·보상으로는 초과 보유 가능) */
function syncTokens(){
 const now=Date.now();
 if(acc.tokenTs>now)acc.tokenTs=now;                       // 시계를 되돌린 경우
 if(acc.tokens>=TOKEN.max){acc.tokenTs=now;return}
 const n=Math.floor((now-acc.tokenTs)/TOKEN.regenMs);
 if(n>0){acc.tokens=Math.min(TOKEN.max,acc.tokens+n);acc.tokenTs=acc.tokens>=TOKEN.max?now:acc.tokenTs+n*TOKEN.regenMs;save()}
}
function tokenEta(){syncTokens();return acc.tokens>=TOKEN.max?0:Math.max(0,TOKEN.regenMs-(Date.now()-acc.tokenTs))}
function addTokens(n){syncTokens();acc.tokens=Math.min(TOKEN.cap,acc.tokens+Math.max(0,Math.floor(n)));save()}
function spendTokens(n){
 syncTokens();if(acc.tokens<n)return false;
 const wasFull=acc.tokens>=TOKEN.max;acc.tokens-=n;
 if(wasFull&&acc.tokens<TOKEN.max)acc.tokenTs=Date.now();
 save();return true;
}

/* 레벨 */
function addXP(n){
 const ups=[];acc.xp+=Math.max(0,Math.round(n));
 while(acc.xp>=XP_NEED(acc.level)){acc.xp-=XP_NEED(acc.level);acc.level++;const r=ECON.levelUp(acc.level);earn(r);addTokens(1);ups.push({level:acc.level,reward:r})}
 return ups;
}
function battleLevelFor(l){return l>=GM_LEVEL?"alkkago":l>=20?"pro":l>=10?"hard":l>=5?"normal":"easy"}
function battleLevel(){return battleLevelFor(acc.level)}
function isGrandmaster(){return acc.level>=GM_LEVEL||acc.rank.best>=GM_TIER}
function mapUnlocked(id){return (MAPS[id]?.unlock||1)<=acc.level}
function upLevel(id){return acc.upgrades[id]||0}
function upCost(u){const l=upLevel(u.id);return l>=u.max?null:u.costs[l]}
function upEff(id){const u=UPGRADES.find(x=>x.id===id);return u?u.eff(upLevel(id)):0}
function myBuffs(){return{mass:upLevel("mass")*.18,grip:upLevel("grip")*.003,power:upLevel("power")*.04,rest:upLevel("bounce")*.06}}
function owns(kind,id){return acc[COSMETIC_SETS[kind].own].includes(id)}
function itemCount(id){return acc.items[id]||0}

/* 랭크 시즌 — 매달 1일 새 시즌 (지난 시즌 최고 티어로 보상, RP 절반 유지) */
function ensureSeason(){
 const s=seasonStr(),r=acc.rank;
 if(r.season===s||s<r.season)return null;               // 같은 시즌이거나 시계를 되돌린 경우
 let reward=null;
 if(r.games>0){const[c,t]=TIERS[r.peak].season;earn(c);addTokens(t);reward={tier:r.peak,coins:c,tokens:t}}
 r.rp=Math.floor(r.rp*.5);r.peak=tierOf(r.rp);r.games=0;r.firsts=0;r.streak=0;r.season=s;save();
 return reward;
}
function seasonLabel(){const[y,mo]=acc.rank.season.split("-");return T("season_name",{y,m:+mo})}
function tierName(rp){const t=tierOf(rp),d=divisionOf(rp);return T("tier_"+TIERS[t].id)+(d?" "+["","I","II","III"][d]:"")}

function pickMissions(date){
 const rnd=seededRng(hashStr(date+"|"+deviceId));
 const pool=MISSION_POOL.filter(m=>(!m.lv||acc.level>=m.lv)&&(!m.map||mapUnlocked(m.map))).map(m=>m.id);
 return shuffle(pool,rnd).slice(0,3);
}
function ensureDaily(){

 if(!acc.daily||acc.daily.date!==t){acc.daily={date:t,list:pickMissions(t).map(id=>({id,p:0,c:false})),bonus:false};save()}
}
const missionDef=id=>MISSION_POOL.find(m=>m.id===id);

 acc.daily.list.forEach(m=>{
  const d=missionDef(m.id);if(!d||d.ev!==ev||m.c||m.p>=d.n)return;
  m.p=Math.min(d.n,m.p+amt);if(m.p>=d.n)done.push(d);
 });
 if(done.length)save();

}

function claimableMissions(){ensureDaily();return acc.daily.list.filter(m=>!m.c&&m.p>=missionDef(m.id).n).length+(canClaimBonus()?1:0)}

 ACHS.forEach(a=>{if(!acc.achSeen[a.id]&&achReached(a)){acc.achSeen[a.id]=true;fresh.push(a)}});
 if(fresh.length){save();fresh.forEach((a,i)=>setTimeout(()=>{showToast(T("ach_toast",{name:T("a_"+a.id)}),"gold");Sound.play("claim")},300+i*600))}
