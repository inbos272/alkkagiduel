 battle:{players:clamp(Math.floor(num(lsGet("alkkagi_ai_players"),4)),2,8),stones:clamp(Math.floor(num(lsGet("alkkagi_ai_stones"),2)),1,4),map:MAPS[lsGet("alkkagi_ai_map")]&&!MAPS[lsGet("alkkagi_ai_map")].hidden?lsGet("alkkagi_ai_map"):"classic"},
 practice:{players:4,stones:2,map:"classic",level:"normal",ai:[]},
 tag:{players:4},
 janggi:{vs:lsGet("alkkagi_jg_vs")==="friend"?"friend":"ai",form:JG_FORMS[lsGet("alkkagi_jg_form")]?lsGet("alkkagi_jg_form"):"masang"},
 use:{}
};
/* 장기 알까기는 친구 대전(한 기기)이면 무료 */
function modeCost(mode,friend){if(mode==="janggi"&&(friend??setupState.janggi.vs==="friend"))return 0;return TOKEN.cost[mode]||0}
function stoneRange(players){return players<=4?[2,4]:[1,3]}
function fixBattleStones(){const s=setupState.battle,[a,b]=stoneRange(s.players);s.stones=clamp(s.stones,a,b)}
fixBattleStones();
function boostersFor(mode){return BOOSTERS.filter(b=>!b.modes||b.modes.includes(mode))}
function openSetup(mode){
 if(mode==="ranked"&&acc.level<RANK_UNLOCK){showToast(T("rank_locked_toast",{n:RANK_UNLOCK}));return}
 setupState.mode=mode;
 if(mode==="battle"&&!mapUnlocked(setupState.battle.map))setupState.battle.map="classic";
 go("setup");
}
function mapSvg(id){
 const m=MAPS[id],b=m.bounds,w=b.x1-b.x0,h=b.y1-b.y0,s=Math.max(w,h);
 const shape=p=>p.t==="c"?`<circle cx="${p.x}" cy="${p.y}" r="${p.r}"/>`:`<rect x="${p.x-p.hw}" y="${p.y-p.hh}" width="${p.hw*2}" height="${p.hh*2}" rx="${p.cr}"/>`;
 return `<svg viewBox="${b.x0+(w-s)/2} ${b.y0+(h-s)/2} ${s} ${s}"><g fill="${m.look==="ice"?"#bfe3f2":m.look==="vortex"?"#d9a866":"#e2b677"}" stroke="#5a3616" stroke-width="10">${m.parts.map(shape).join("")}</g><g fill="#e2b677">${m.parts.map(shape).join("")}</g>${m.holes.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="${p.r}" fill="#120c07"/>`).join("")}${m.bumpers.map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r*1.3}" fill="#8a5a2a"/>`).join("")}${m.look==="vortex"?`<path d="M300 300m-150 0a150 150 0 1 1 150 150" fill="none" stroke="#6b3e14" stroke-width="16" opacity=".6"/>`:""}</svg>`;
}
function stepperHtml(key,val,min,max){return `<div class="stepper"><button data-step="${key}" data-dir="-1" ${val<=min?"disabled":""}>−</button><div class="val">${val}</div><button data-step="${key}" data-dir="1" ${val>=max?"disabled":""}>+</button></div>`}
function boosterHtml(mode){
 const list=boostersFor(mode);let any=false;
 const h=list.map(it=>{const n=itemCount(it.id);if(!n)setupState.use[it.id]=false;else any=true;
  return `<button class="booster ${setupState.use[it.id]?"active":""} ${n?"":"empty"}" data-boost="${it.id}"><span class="b-ico">${it.ico}</span>${T(it.nameKey)}<small>×${n}</small></button>`}).join("");
 return `<div class="field"><div class="field-label"><span>${T("field_boosters")}</span><small>${any?T("booster_hint"):T("booster_none")}</small></div><div class="booster-row">${h}</div></div>`;
}
function mapPickerHtml(cur,practice){
 return `<div class="map-grid">${MAP_ORDER.map(k=>{const lock=!practice&&!mapUnlocked(k);return `<button class="map-chip ${cur===k?"active":""} ${lock?"locked":""}" data-map="${k}">${lock?`<i class="lk">🔒</i>`:""}${mapSvg(k)}${T("map_"+k)}<small>${lock?T("unlock_lv",{n:MAPS[k].unlock}):T("map_"+k+"_desc")}</small></button>`}).join("")}</div>`;
}
function rulesHtml(keys,vars){return `<ul class="rules">${keys.map(([ico,k])=>`<li><i>${ico}</i><span>${T(k,vars)}</span></li>`).join("")}</ul>`}
function renderSetup(){
 const mode=setupState.mode,body=$("setupBody"),st=setupState,cost=modeCost(mode);
 $("setupTitle").textContent=T(mode==="ranked"?"mode_ranked":"mode_"+mode);
 let h="",reward="";
 if(mode==="battle"){
  const s=st.battle,[a,b]=stoneRange(s.players),lv=battleLevel();
  h+=`<p class="note">${T("battle_intro")}</p>`;
  h+=`<div class="field"><div class="field-label"><span>${T("field_ai_total")}</span></div>${stepperHtml("bPlayers",s.players,2,8)}<div class="dots-preview">${Array.from({length:s.players},(_,i)=>`<i style="background:${PLAYER_COLORS[i]}"></i>`).join("")}</div></div>`;
  h+=`<div class="field"><div class="field-label"><span>${T("field_stones")}</span><small>${T("stones_range",{a,b})}</small></div>${stepperHtml("bStones",s.stones,a,b)}</div>`;
  h+=`<div class="field"><div class="field-label"><span>${T("field_map")}</span></div>${mapPickerHtml(s.map,false)}</div>`;
  h+=`<div class="field"><div class="field-label"><span>${T("field_ai_level")}</span></div><div class="chip-row"><div class="chip active">🤖 ${T("ai_"+lv)} · ${T(titleOf(acc.level)[1])}</div></div><div class="lock-note">${T("ai_by_title")}</div></div>`;
  h+=boosterHtml(mode);
  reward=`<span class="c">${T("rp_win",{n:ECON.battleWin(s.players)})}</span><span class="x">XP +${winXP(s.players)}</span>`;
 }else if(mode==="ranked"){
  const r=acc.rank,t=tierOf(r.rp);
  h+=`<div class="info-card hero">${tierEmblem(t,"lg")}<div class="ic-main"><div class="rank-kicker">${T("ranked_kicker",{s:seasonLabel()})}</div><div class="ic-title">${escapeHtml(tierName(r.rp))}</div><div class="ic-sub">${t<GM_TIER?T("rp_of",{a:r.rp,b:TIERS[t+1].min}):r.rp+" RP"} · ${T("season_left",{d:daysLeftInSeason()})}</div><div class="rank-bar"><i style="width:${Math.round(tierProgress(r.rp)*100)}%"></i></div></div></div>`;
  h+=`<div class="info-card">${rulesHtml([["👥","ranked_rule_1"],["🗺️","ranked_rule_2"],["🤖","ranked_rule_3"],["🏅","ranked_rule_4"]],{ai:T("ai_"+TIERS[t].ai)})}
   <div class="rp-table">${[1,2,3,4].map(p=>{const d=rpDelta(p,t,r.streak);return `<div>${T("place_n",{n:p})}<b class="${d>=0?"up":"dn"}">${d>0?"+":""}${d}</b></div>`}).join("")}</div></div>`;
  h+=boosterHtml(mode);
  reward=`<span class="c">${T("rp_place1",{n:ECON.rankedPlace[0]})}</span><span class="x">XP +${winXP(4)}</span>`;
 }else if(mode==="boss"){
  const lv=acc.boss.level,bs=bossStats(lv);
  h+=`<div class="info-card hero"><div class="boss-face">👹</div><div class="ic-main"><div class="rank-kicker">BIG BOSS</div><div class="ic-title">${T("boss_name_lv",{n:lv})}</div><div class="ic-sub">${T("boss_stats",{m:bs.mass.toFixed(1),s:bs.scale.toFixed(1),ai:T("ai_"+bs.aiName)})}</div><div class="hp-pips">${Array.from({length:bs.hp},()=>"<i></i>").join("")}</div></div></div>`;
  h+=`<div class="info-card">${rulesHtml([["🤝","boss_rule_1"],["⬛","boss_rule_2"],["❤️","boss_rule_3"],["💢","boss_rule_4"],["⏱️","boss_rule_5"]],{hp:bs.hp})}</div>`;
  h+=boosterHtml(mode);
  reward=`<span class="c">${T("rp_win",{n:ECON.bossWin(lv)})}</span><span class="x">XP +${winXP(5)+lv*5}</span>`;
 }else if(mode==="tag"){
  const s=st.tag;
  h+=`<div class="info-card hero"><div class="boss-face" style="background:radial-gradient(circle at 35% 28%,#8ff0e0,#1a6e63 70%);box-shadow:0 0 0 3px #0006,0 0 30px #6fd8c855">🏃</div><div class="ic-main"><div class="rank-kicker">TAG</div><div class="ic-title">${T("mode_tag")}</div><div class="ic-sub">${T("tag_intro")}</div></div></div>`;
  h+=`<div class="field"><div class="field-label"><span>${T("field_ai_total")}</span><small>3~6</small></div>${stepperHtml("tPlayers",s.players,3,6)}<div class="dots-preview">${Array.from({length:s.players},(_,i)=>`<i style="background:${PLAYER_COLORS[i]}"></i>`).join("")}</div></div>`;
  h+=`<div class="info-card">${rulesHtml([["🗺️","tag_rule_1"],["👉","tag_rule_2"],["🚫","tag_rule_3"],["⭐","tag_rule_4"],["💨","tag_rule_5"]],{r:TAG_ROUNDS})}</div>`;
  h+=boosterHtml(mode);
  reward=`<span class="c">${T("rp_place1",{n:ECON.tagPlace[0]})}</span><span class="x">XP +${winXP(s.players)}</span>`;
 }else if(mode==="janggi"){
  const s=st.janggi,lv=battleLevel(),f=JG_FORMS[s.form],nm={ma:"馬",sang:"象"};
  h+=`<div class="info-card hero"><div class="hero-jg"><div class="jg-pc cho big">楚</div><div class="jg-pc han big">漢</div></div><div class="ic-main"><div class="rank-kicker">JANGGI ALKKAGI</div><div class="ic-title">${T("mode_janggi")}</div><div class="ic-sub">${T("janggi_intro")}</div></div></div>`;
  h+=`<div class="field"><div class="field-label"><span>${T("field_vs")}</span></div><div class="chip-row">${["ai","friend"].map(k=>`<button class="chip ${s.vs===k?"active":""}" data-vs="${k}">${T("vs_"+k)}${k==="ai"?`<small>🤖 ${T("ai_"+lv)}</small>`:`<small>${T("free")}</small>`}</button>`).join("")}</div></div>`;
  h+=`<div class="field"><div class="field-label"><span>${T("field_formation")}</span></div><div class="chip-row">${Object.keys(JG_FORMS).map(k=>`<button class="chip ${s.form===k?"active":""}" data-form="${k}" style="min-width:64px">${T("form_"+k)}<small style="font-family:serif;font-size:12px;color:#7fd3a6">車${JG_FORMS[k].slice(0,2).map(x=>nm[x]).join("")}士 · 士${JG_FORMS[k].slice(2).map(x=>nm[x]).join("")}車</small></button>`).join("")}</div></div>`;
  void f;
  h+=`<div class="info-card">${rulesHtml([["⚔️","janggi_rule_1"],["💥","janggi_rule_2"],["👑","janggi_rule_3"],["⚖️","janggi_rule_4"]])}</div>`;
  if(s.vs==="ai"){h+=boosterHtml(mode);reward=`<span class="c">${T("rp_win",{n:ECON.janggiWin})}</span><span class="x">XP +${winXP(2)}</span>`}
  else h+=`<p class="lock-note">${T("janggi_friend_note")}</p>`;
 }else{
  const s=st.practice,gm=isGrandmaster();
  h+=`<p class="note">${T("practice_intro")}</p>`;
  h+=`<div class="field"><div class="field-label"><span>${T("field_players")}</span></div>${stepperHtml("pPlayers",s.players,2,8)}</div>`;
  h+=`<div class="field"><div class="field-label"><span>${T("field_stones")}</span></div>${stepperHtml("pStones",s.stones,1,4)}</div>`;
  h+=`<div class="field"><div class="field-label"><span>${T("field_map")}</span><small>${T("practice_all_maps")}</small></div>${mapPickerHtml(s.map,true)}</div>`;
  if(s.level==="alkkago"&&!gm)s.level="pro";
  h+=`<div class="field"><div class="field-label"><span>${T("field_ai_level")}</span></div><div class="chip-row">${AI_ORDER.map(k=>{const lock=k==="alkkago"&&!gm;return `<button class="chip ${s.level===k?"active":""} ${lock?"locked":""}" data-level="${k}">${lock?"🔒 ":""}${T("ai_"+k)}${k==="alkkago"?`<small>${T("gm_only")}</small>`:""}</button>`}).join("")}</div></div>`;
  h+=`<div class="field"><div class="field-label"><span>${T("field_players_list_title")}</span><small>${T("field_players_list_desc")}</small></div><div class="player-list">${Array.from({length:s.players},(_,i)=>{if(s.ai[i]===undefined)s.ai[i]=i>0;
   return `<div class="player-row"><div class="dot" style="background:${PLAYER_COLORS[i]}"></div><div class="pname">${T("player_n",{n:i+1})}</div><div class="sw-label">${s.ai[i]?T("sw_ai"):T("sw_human")}</div><button class="switch ${s.ai[i]?"on":""}" data-sw="${i}" aria-label="AI"><i></i></button></div>`}).join("")}</div></div>`;
  h+=`<p class="lock-note">${T("practice_no_reward")}</p>`;
 }
 body.innerHTML=h;
 $("setupReward").innerHTML=reward+(cost?`<span class="t">🎟️ ${T("token_cost",{n:cost})}</span>`:"");
 const btn=$("btnSetupStart");
 btn.innerHTML=escapeHtml(T("btn_start"))+(cost?` <span class="cost">🎟️ ${cost}</span>`:"");
 btn.classList.toggle("disabled",!!cost&&acc.tokens<cost);
}
$("setupBody").addEventListener("click",ev=>{
 const el=ev.target.closest("button");if(!el)return;
 const st=setupState,d=el.dataset;
 if(d.step){
  const dir=+d.dir,map={bPlayers:[st.battle,"players",2,8],bStones:[st.battle,"stones",...stoneRange(st.battle.players)],tPlayers:[st.tag,"players",3,6],pPlayers:[st.practice,"players",2,8],pStones:[st.practice,"stones",1,4]}[d.step];
  if(!map)return;const[o,k,a,b]=map,prev=o[k];o[k]=clamp(o[k]+dir,a,b);if(o[k]===prev)return;
  Sound.play("ui");
  if(d.step==="bPlayers")fixBattleStones();
  if(o===st.battle){lsSet("alkkagi_ai_players",st.battle.players);lsSet("alkkagi_ai_stones",st.battle.stones)}
 }else if(d.map){
  const practice=st.mode==="practice";
  if(!practice&&!mapUnlocked(d.map)){Sound.play("back");showToast(T("map_locked_toast",{n:MAPS[d.map].unlock}));return}
  Sound.play("ui");if(practice)st.practice.map=d.map;else{st.battle.map=d.map;lsSet("alkkagi_ai_map",d.map)}
 }else if(d.level){
  if(d.level==="alkkago"&&!isGrandmaster()){Sound.play("back");showToast(T("gm_only_toast"));return}
  Sound.play("ui");st.practice.level=d.level;
 }else if(d.sw!==undefined){
  const i=+d.sw;st.practice.ai[i]=!st.practice.ai[i];Sound.play("ui");
 }else if(d.vs){
  st.janggi.vs=d.vs;lsSet("alkkagi_jg_vs",d.vs);Sound.play("ui");
 }else if(d.form){
  st.janggi.form=d.form;lsSet("alkkagi_jg_form",d.form);Sound.play("ui");
 }else if(d.boost){
  if(!itemCount(d.boost)){Sound.play("ui");shopTab="item";go("shop");return}
  st.use[d.boost]=!st.use[d.boost];Sound.play("ui");
 }else return;
 const y=$("setupBody").scrollTop;renderSetup();$("setupBody").scrollTop=y;
});
$("btnSetupStart").onclick=()=>{Sound.unlock();Sound.play("ui");startFromSetup()};

/* ============================================================
   상점 — 오늘의 특가 · 강화 · 꾸미기 · 아이템 · 토큰
============================================================ */
let shopTab="upgrade",cosKind="skin",onlyNew=false;
document.querySelectorAll("#shopSeg [data-tab]").forEach(b=>b.onclick=()=>{shopTab=b.dataset.tab;Sound.play("ui");renderShop()});
const skinById=id=>SKINS.find(s=>s.id===id)||SKINS[0];
const trailById=id=>TRAILS.find(t=>t.id===id)||TRAILS[0];
function failBuy(c){showToast(T("coin_insufficient",{n:c}),"bad");Sound.play("back")}
function ensureDeals(){
 const t=todayStr();
 if(acc.deals&&acc.deals.date===t)return;
 const rnd=seededRng(hashStr(t+"|deal|"+deviceId)),pool=[];
 for(const kind in COSMETIC_SETS)COSMETIC_SETS[kind].list.forEach(it=>{if(it.cost>0&&!owns(kind,it.id))pool.push(kind+":"+it.id)});
 acc.deals={date:t,list:shuffle(pool,rnd).slice(0,DEAL_COUNT)};save();
}
function dealPrice(kind,item){
 ensureDeals();
 return acc.deals.list.includes(kind+":"+item.id)?Math.round(item.cost*(1-DEAL_OFF)):item.cost;
}
const previewCache=new Map();
function skinPreview(sk){
 if(previewCache.has(sk.id))return previewCache.get(sk.id);
 const url=stoneCanvas(sk.colors?skinColorSpec(sk,0):{...PLAYER_STONES[0],glow:.2},40).toDataURL();previewCache.set(sk.id,url);return url;
}
function trailPreview(tr,big){
 const k=big?1.8:1;
 if(!tr.colors.length)return `<div style="width:${36*k}px;height:${7*k}px;border-radius:99px;background:#00000033"></div>`;
 const g=tr.rainbow?"linear-gradient(90deg,#ff5c7a,#ffd166,#7ee08a,#55bfff,#c084fc)":`linear-gradient(90deg,${tr.colors[0]}00,${tr.colors[0]},${tr.colors[1]})`;
 if(tr.style==="dots")return `<div style="display:flex;gap:${4*k}px;align-items:center">${[6,9,12].map(s=>`<i style="width:${s*k}px;height:${s*k}px;border-radius:50%;border:${2*k}px solid ${tr.colors[0]};display:block"></i>`).join("")}</div>`;
 if(tr.style==="stars")return `<div style="color:${tr.colors[1]};font-size:${14*k}px;letter-spacing:-1px;text-shadow:0 0 8px ${tr.colors[0]}">✦★✦</div>`;
 return `<div style="width:${48*k}px;height:${(tr.wide?11:7)*k}px;border-radius:99px;background:${g};box-shadow:0 0 14px ${tr.colors[0]}88"></div>`;
}
function cosmeticPreview(kind,item,big){
 if(kind==="skin")return `<div class="prev ${big?"big":""}"><img src="${skinPreview(item)}" alt=""></div>`;
 if(kind==="trail")return `<div class="prev dark ${big?"big":""}">${trailPreview(item,big)}</div>`;
 if(kind==="avatar")return `<div class="prev dark ${big?"big":""}">${item.ico||titleOf(acc.level)[2]}</div>`;
 return `<div class="prev dark ${big?"big":""}">${item.ico}</div>`;
}
function rarBadges(item){return `<i class="rar-tag">${rarName(item.rar)}</i>${item.pw?`<i class="pw-mark">⚡</i>`:""}`}
function pwName(id){return T("pw_"+id+"_n")}
function pwDesc(id,r){
 const s=pwStr(r),p={power:Math.round(35*s),grow:Math.round(40*s),heavy:(2.2*s).toFixed(1).replace(/\.0$/,"")}[id];
 return T("pw_"+id+"_d",{p});
}
function pwBox(item){
 if(!item.pw)return "";
 return `<div class="pw-box r${item.rar}"><b>${T("pw_title",{name:POWERS[item.pw].ico+" "+pwName(item.pw)})}</b><span>${pwDesc(item.pw,item.rar)}</span><small>${T("pw_uses",{n:pwUses(item.rar)})}</small></div>`;
}
function renderDeals(){
 ensureDeals();
 const strip=$("dealStrip"),list=acc.deals.list.map(k=>{const[kind,id]=k.split(":");const item=COSMETIC_SETS[kind]?.list.find(x=>x.id===id);return item?{kind,item}:null}).filter(Boolean);
 const ms=msUntilMidnight();$("dealTimer").textContent=T("deals_reset",{h:Math.floor(ms/3600000),m:Math.floor(ms%3600000/60000)});
 if(!list.length){strip.innerHTML=`<div class="note" style="grid-column:1/-1">${T("deals_empty")}</div>`;return}
 strip.innerHTML=list.map(({kind,item},i)=>{const own=owns(kind,item.id);
  return `<button class="deal-card r${item.rar} ${own?"sold":""}" data-deal="${i}">${rarBadges(item)}${own?"":`<i class="deal-off">-${Math.round(DEAL_OFF*100)}%</i>`}${cosmeticPreview(kind,item)}<div class="kind">${T("kind_"+kind)}</div><div class="nm">${T(item.nameKey)}</div><div class="price">${own?T("owned"):`<s>${item.cost}</s>🪙 ${dealPrice(kind,item)}`}</div></button>`}).join("");
 strip.querySelectorAll("[data-deal]").forEach(b=>b.onclick=()=>{const d=list[+b.dataset.deal];Sound.play("ui");openItemSheet(d.kind,d.item)});
}
function renderShop(){
 renderDeals();
 document.querySelectorAll("#shopSeg [data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===shopTab));
 const sub=$("shopSub"),list=$("shopList");sub.innerHTML="";list.innerHTML="";list.className="";
 if(shopTab==="upgrade"){
  $("shopNote").textContent=T("shop_note_upgrade");list.className="list";
  UPGRADES.forEach(u=>{
   const lv=upLevel(u.id),cost=upCost(u),maxed=cost===null,afford=!maxed&&acc.coins>=cost;
   const row=document.createElement("div");row.className="up-card";
   const next=maxed?"":` → ${T(u.effKey,{n:u.eff(lv+1)})}`;
   row.innerHTML=`<div class="up-ico">${u.ico}</div><div class="up-main"><div class="up-title">${T(u.nameKey)}<span class="up-lv">${T("level_of",{a:lv,b:u.max})}</span></div><div class="up-desc">${T(u.descKey)}</div><div class="up-eff">${lv?T(u.effKey,{n:u.eff(lv)}):T("not_owned")}${next}</div><div class="pips">${Array.from({length:u.max},(_,i)=>`<i class="${i<lv?"on":""}"></i>`).join("")}</div></div><button class="buy-btn ${maxed?"max":afford?"":"locked"}">${maxed?T("maxed"):"🪙 "+cost+"<br>"+T("upgrade")}</button>`;
   if(!maxed)row.querySelector(".buy-btn").onclick=()=>buyUpgrade(u);
   list.appendChild(row);
  });
 }else if(shopTab==="cosmetic"){
  const set=COSMETIC_SETS[cosKind];
  sub.innerHTML=`<div class="sub-row"><div class="scroll-row">${Object.keys(COSMETIC_SETS).map(k=>`<button class="chip ${k===cosKind?"active":""}" data-kind="${k}">${COSMETIC_SETS[k].ico} ${T("kind_"+k)}</button>`).join("")}</div><button class="filter-tg ${onlyNew?"on":""}" id="filterNew">${T("filter_new")}</button></div>
   <div class="collect"><span>${T("collected",{a:acc[set.own].length,b:set.list.length})}</span><div class="m-bar"><i style="width:${Math.round(acc[set.own].length/set.list.length*100)}%"></i></div></div>`;
  sub.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{cosKind=b.dataset.kind;Sound.play("ui");renderShop()});

function buyUpgrade(u){
 const cost=upCost(u);if(cost===null)return;
 if(acc.coins<cost)return failBuy(cost);
 const doBuy=()=>{if(upCost(u)!==cost||!spend(cost))return failBuy(cost);acc.upgrades[u.id]=upLevel(u.id)+1;save();Sound.play("buy");floatDelta(-cost);showToast(T("purchased"),"good");checkAchievements();refreshAll()};
 if(cost>=CONFIRM_ABOVE)queueModal({ico:u.ico,title:T(u.nameKey),body:T("confirm_buy",{n:cost}),okText:T("buy"),cancelText:T("btn_cancel"),onOk:doBuy});
 else doBuy();
}
function buyOrEquip(kind,item){
 const set=COSMETIC_SETS[kind];if(acc[set.eq]===item.id)return false;
 if(!owns(kind,item.id)){
  const price=dealPrice(kind,item);
  if(!spend(price)){failBuy(price);return false}
  acc[set.own].push(item.id);floatDelta(-price);Sound.play("buy");showToast(T("purchased"),"good");
 }else Sound.play("ui");
 acc[set.eq]=item.id;save();
 if(kind==="skin")spriteCache.clear();
 checkAchievements();refreshAll();
 return true;
}
function buyItem(it){

 acc.items[it.id]=itemCount(it.id)+1;save();Sound.play("buy");showToast(T("purchased"),"good");refreshAll();
}
function buyTokens(p){

}
/* 행운 상자: 55% 확률로 아직 없는 꾸미기 아이템, 아니면 코인 */
function openLuckyBox(){
 acc.boxes++;
 const pool=[];
 for(const kind in COSMETIC_SETS)COSMETIC_SETS[kind].list.forEach(it=>{if(it.cost>0&&!owns(kind,it.id))pool.push({kind,it})});
 let result;
 if(pool.length&&Math.random()<.55){
  const p=pick(pool);acc[COSMETIC_SETS[p.kind].own].push(p.it.id);
  result={ico:p.kind==="skin"?"🎨":p.kind==="trail"?"✨":p.it.ico,title:T("box_cosmetic",{kind:T("kind_"+p.kind),name:T(p.it.nameKey)}),body:"✦ "+rarName(p.it.rar)+(p.it.pw?" · ⚡ "+pwName(p.it.pw):"")+"\n"+T("box_sub")};
 }else{
  const table=[[15,30],[25,25],[40,20],[60,13],[100,8],[200,4]];
  let r=Math.random()*100,amt=15;for(const[v,w]of table){if(r<w){amt=v;break}r-=w}
  earn(amt);result={ico:"🪙",title:T("box_coins",{n:amt}),body:"",coins:amt};
 }
 save();
 queueModal({ico:"🎁",title:T("item_box"),body:"✨ ✨ ✨",okText:T("open"),sound:"buy",onOk:()=>{
  queueModal({ico:result.ico,title:result.title,body:result.body,reward:result.coins?"🪙 +"+result.coins:"",sound:"levelup",onOk:()=>{if(result.coins)floatDelta(result.coins);checkAchievements();refreshAll()}});
 }});
}

class Engine{
 constructor(o){
  const m=MAPS[o.map]||MAPS.classic;
  this.map=m;this.W=m.world[0];this.H=m.world[1];this.cx=this.W/2;this.cy=this.H/2;
  this.walls=!!m.walls;this.swirl=m.swirl||0;
  this.bumpers=m.bumpers.map(([x,y,r])=>({x,y,r}));
  this.players=o.players.map((p,i)=>({id:i,team:p.team==null?i:p.team,boss:!!p.boss}));
  this.order=(o.order||this.players.map(p=>p.id)).slice();

function updateCamera(dt){

/* ============================================================
   3D 카메라 제어 — 조준(aim) · 추적(chase) · 잠시 멈춤(hold) · 2D 복귀(return)
============================================================ */
function cam3dActive(){return cam3dPref&&gl3Init()}
function camReset(){CAM.mode="2d";CAM.state="idle";CAM.p=null;CAM.aim=null;CAM.chase=null;setGLVisible(false);showAimUI(false)}
function camCurrent(){return CAM.mode==="2d"||!CAM.p?cam2dParams():{...CAM.p}}
function camSet(state,dur,extra){
 CAM.from=camCurrent();CAM.t0=performance.now();CAM.dur=dur;CAM.state=state;if(extra)Object.assign(CAM,extra);
 if(CAM.mode==="2d"){CAM.mode="3d";CAM.p=CAM.from}

function chaseTarget(dt){
 const e=G.e,ch=CAM.chase;let s=e.stones[ch.id];
 const sp=s&&s.alive?Math.hypot(s.vx,s.vy):0;
 /* 친 알이 거의 멈추고 다른 알이 훨씬 빠르게 날아가면 그 알로 시선 전환 */
 if(sp<1.2){let best=null,bv=Math.max(2.4,sp*2.5);for(const o of e.stones)if(o.alive){const v=Math.hypot(o.vx,o.vy);if(v>bv){bv=v;best=o}}if(best){ch.id=best.id;s=best}}
 if(s&&s.alive){
  const k=1-Math.exp(-dt/110),sx=s.ix??s.x,sy=s.iy??s.y;ch.x+=(sx-ch.x)*k;ch.y+=(sy-ch.y)*k;
  const v=Math.hypot(s.vx,s.vy);if(v>.9)ch.yaw=angLerp(ch.yaw,Math.atan2(s.vy,s.vx),1-Math.exp(-dt*.0016*Math.min(v,9)/4));
 }
 const F=[Math.cos(ch.yaw),Math.sin(ch.yaw)];
 return{tx:ch.x+F[0]*ch.r*3.2,ty:ch.y+F[1]*ch.r*3.2,yaw:ch.yaw,pitch:.62,dist:ch.r*15.5};
}
function camTarget(dt){
 const e=G.e;
 if(CAM.state==="aim"&&CAM.aim){const s=e.stones[CAM.aim.id];if(s)return camAimParams(s,CAM.aim.yaw)}
 if(CAM.state==="chase"&&CAM.chase)return chaseTarget(dt);

}
function updateCam(dt,now){
 if(CAM.mode==="2d"||!G.e)return;
 if(CAM.state==="hold"&&now>CAM.holdUntil){camSet("return",isFast()?380:720)}
 const tgt=camTarget(dt),t=CAM.dur?clamp((now-CAM.t0)/CAM.dur,0,1):1;
 if(t<1)CAM.p=lerpCam(CAM.from,tgt,easeIO(t));
 else if(CAM.state==="chase"){const k=1-Math.exp(-dt/120);CAM.p=lerpCam(CAM.p,tgt,k)}
 else CAM.p=tgt;
 if(CAM.state==="return"&&t>=1){CAM.mode="2d";CAM.state="idle";CAM.p=null}
}
/* ---- AI 샷 연출: 위에서 알 뒤로 날아들어가 → 방향을 돌리고 → 당겼다가 → 발사 ---- */
function startCine(shot,o){
 const e=G.e,s=e.stones[shot.id],fin=Math.atan2(shot.ay,shot.ax),start=fin+(Math.random()<.5?-1:1)*(.35+Math.random()*.3);
 G.cine={shot,o,gen:G.gen,phase:"fly",t0:performance.now(),start,fin,pull:0,lastS:0};
 CAM.aim={id:shot.id,yaw:start};camSet("aim",isFast()?450:900);Sound.play("whoosh");

}
function updateCine(now){
 const c=G.cine;if(!c)return;
 const e=G.e;
 if(c.gen!==G.gen||!G.active||!e||e.moving||e.turn!==c.o){G.cine=null;return}
 const fast=isFast(),D={fly:fast?450:900,turn:fast?260:600,pull:fast?260:560,rel:fast?60:140}[c.phase],t=clamp((now-c.t0)/D,0,1);
 if(c.phase==="fly"){if(t>=1){c.phase="turn";c.t0=now}}
 else if(c.phase==="turn"){CAM.aim.yaw=angLerp(c.start,c.fin,easeIO(t));if(t>=1){c.phase="pull";c.t0=now}}
 else if(c.phase==="pull"){CAM.aim.yaw=c.fin;c.pull=c.shot.f*easeIO(t);if(c.pull-c.lastS>.07){c.lastS=c.pull;Sound.play("stretch",c.pull)}if(t>=1){c.phase="rel";c.t0=now}}
 else if(c.phase==="rel"){if(t>=1){const sh=c.shot;G.cine=null;fire(sh.id,sh.ax,sh.ay,sh.f)}}
}

function screenToWorld(p){if(CAM.mode==="2d"||!CAM.p)return toWorld(p);return unproj(camBasis(CAM.p),p.x,p.y,8)||{x:-1e6,y:-1e6}}
function pickOwnStone(e,p){

/* 장전된 샷 능력을 알에 싣기 (preview=true면 예지 계산용 복제본) */
function applyArmed(s,preview){
 const a=G.armed;if(!s||!Object.keys(a).length)return;
 if(a.power)s.boost=1+.35*a.power;
 if(a.shock)s.shock=a.shock;
 if(a.brake)s.brake=true;
 if(a.magnet)s.seek=.016*a.magnet;
 if(a.grow)s.grow=1+.4*a.grow;
 if(a.ghost)s.ghost=true;
 if(!preview){if(a.double)G.extraTurn=true;G.armed={}}
}

/* ---- 입력: 2D는 내 알을 당겼다 놓기 · 3D는 알을 눌러 조준 화면 → 좌우 스와이프로 방향, 아래로 당겼다 놓아 발사
        술래잡기 맵은 빈 곳을 끌어 둘러보기 ---- */
function evPos(ev){const r=canvas.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top}}
function pull3dMax(){return clamp(view.H*.3,150,260)}
/* 조준 중인 내 알 위를 눌렀는지 (화면상 알 크기보다 조금 넉넉하게) */
function onAimStone(p){
 const e=G.e,s=G.aim3d&&e.stones[G.aim3d.id];if(!s||!CAM.p)return false;
 const q=proj(camBasis(CAM.p),s.ix??s.x,s.iy??s.y,stoneH(s)*.6);if(!q)return false;
 return Math.hypot(p.x-q.x,p.y-q.y)<=Math.max(s.r*q.k*1.45,40)?q:false;
}
canvas.addEventListener("pointerdown",ev=>{
 Sound.unlock();
 const e=G.e;if(!e||ptr)return;
 const p=evPos(ev);
 if(isHumanTurn()&&!G.cine){
  if(G.aim3d){
   /* 알을 잡고 끌면 → 발사 준비(당기기) · 알 밖을 끌면 → 방향 회전만 (절대 발사 안 됨) */
   const grab=onAimStone(p);
   /* 최대 힘까지 당기는 거리 = 잡은 곳부터 화면 아래 끝까지 (손가락이 화면 밖으로 나가지 않게) */
   ptr={id:ev.pointerId,kind:grab?"pull3d":"rot3d",x0:p.x,y0:p.y,lx:p.x,moved:0,f:0,max:clamp(view.H-p.y-18,90,pull3dMax())};
   if(grab){Sound.play("stretch",0);haptic(8)}
   try{canvas.setPointerCapture(ev.pointerId)}catch(err){}
   return;
  }
  const best=pickOwnStone(e,p);
  if(best){
   if(cam3dActive()){enterAim3d(best);return}
   ptr={id:ev.pointerId,kind:"aim",stone:best,f:0,ax:0,ay:0};$("powerWrap").classList.add("show");
   try{canvas.setPointerCapture(ev.pointerId)}catch(err){}
   return;
  }
 }
 if(e.walls&&CAM.mode==="2d"){ptr={id:ev.pointerId,kind:"pan",x:p.x,y:p.y};view.follow=false;try{canvas.setPointerCapture(ev.pointerId)}catch(err){}}
});
canvas.addEventListener("pointermove",ev=>{
 if(!ptr||ev.pointerId!==ptr.id)return;
 const p=evPos(ev);
 if(ptr.kind==="pan"){view.camX-=(p.x-ptr.x)/view.zoom;view.camY-=(p.y-ptr.y)/view.zoom;ptr.x=p.x;ptr.y=p.y;clampCam();return}
 if(!isHumanTurn()){clearAimState();return}
 if(ptr.kind==="rot3d"||ptr.kind==="pull3d"){
  if(!G.aim3d||!CAM.aim)return;
  const dx=p.x-ptr.lx;ptr.lx=p.x;ptr.moved=Math.max(ptr.moved,Math.hypot(p.x-ptr.x0,p.y-ptr.y0));
  if(!acc.aimTipSeen&&ptr.moved>40){acc.aimTipSeen=true;save();$("aim3dTip").classList.remove("show")}
  if(ptr.kind==="rot3d"){CAM.aim.yaw=angWrap(CAM.aim.yaw+dx*.0058);return}   // 화면 돌리기: 방향만
  /* 알 잡고 당기기: 화면 아래쪽(내 쪽)으로 끈 만큼 힘 · 방향은 고정 */
  const f=clamp((p.y-ptr.y0)/ptr.max,0,1);
  ptr.f=f;G.aim3d.f=f;
  if(Math.abs(f-G.aim3d.lastS)>.06){G.aim3d.lastS=f;if(f>.02)Sound.play("stretch",f)}
  const pc=Math.round(f*100);$("powerFill").style.width=pc+"%";$("powerPct").textContent=pc+"%";
  return;
 }
 const sp=toScreen(ptr.stone.x,ptr.stone.y),dx=sp.x-p.x,dy=sp.y-p.y,f=Math.min(1,Math.hypot(dx,dy)/pullMaxPx());
 ptr.ax=dx;ptr.ay=dy;ptr.f=f;
 const pc=Math.round(f*100);$("powerFill").style.width=pc+"%";$("powerPct").textContent=pc+"%";
});
function releasePointer(ev){
 if(!ptr||ev.pointerId!==ptr.id)return;
 const q=ptr;ptr=null;
 if(q.kind==="rot3d"||q.kind==="pull3d"){
  if(!G.aim3d)return;
  const e=G.e;
  if(q.kind==="pull3d"&&ev.type==="pointerup"&&isHumanTurn()&&q.f>=.06){const yaw=CAM.aim.yaw,id=G.aim3d.id;fire(id,Math.cos(yaw),Math.sin(yaw),q.f);return}
  if(q.kind==="rot3d"&&q.moved<8&&ev.type==="pointerup"){const s=pickOwnStone(e,evPos(ev));if(s&&s.id!==G.aim3d.id){enterAim3d(s);return}}
  G.aim3d.f=0;$("powerFill").style.width="0";$("powerPct").textContent="0%";
  return;
 }
 if(q.kind!=="aim")return;
 clearAimState();
 if(ev.type==="pointerup"&&isHumanTurn()&&q.f*pullMaxPx()>=6)fire(q.stone.id,q.ax,q.ay,q.f);
}
canvas.addEventListener("pointerup",releasePointer);canvas.addEventListener("pointercancel",releasePointer);

/* ---- 메인 루프 ---- */
function loop(g,t){
 if(G.gen!==g||!isActive("game")||!G.e)return;
 tick(t);
 requestAnimationFrame(tt=>loop(g,tt));
}
/* 일부 웹뷰는 화면이 가려지면 requestAnimationFrame을 멈춤 → 타이머로 물리만이라도 진행 */
setInterval(()=>{
 if(document.hidden||!G.e||!isActive("game"))return;
 const now=performance.now();if(now-G.lastT>250)tick(now);
},120);
function tick(t){
 const e=G.e;if(!e)return;
 const dt=Math.min(100,Math.max(0,t-G.lastT));G.lastT=t;
 const slow=t<G.slowUntil?.55:1;   // 알이 떨어지는 순간 짧은 슬로모션
 if(e.moving){
  G.acc+=dt*(isFast()?2.2:1)*slow;const stepMs=1000/60;let n=0;
  while(G.acc>=stepMs&&n<16){for(const s of e.stones){s.px=s.x;s.py=s.y}e.step();recordTrail(e);G.acc-=stepMs;n++;if(!e.moving){G.acc=0;onSettle();break}}
  if(n>=16)G.acc=0;
 }else{G.acc=0;if(trailHistory.size)recordTrail(e)}
 /* 화면 주사율(120Hz 등)과 물리(60Hz)가 달라도 매끄럽게: 직전 스텝과 현재 스텝 사이를 보간해 그림 */
 const ia=e.moving?clamp(G.acc/(1000/60),0,1):1;
 for(const s of e.stones){if(s.px==null||!e.moving||Math.abs(s.x-s.px)+Math.abs(s.y-s.py)>60){s.ix=s.x;s.iy=s.y}else{s.ix=s.px+(s.x-s.px)*ia;s.iy=s.py+(s.y-s.py)*ia}}
 updateCine(t);updateCam(dt,t);updateCamera(dt);updateFx(dt*slow);render(t);
}

/* 순위 = 1 + (나보다 오래 살아남은 플레이어 수) — 같은 샷에 함께 탈락하면 공동 순위 */
function placeOf(e,o){
 const out=G.elim.find(x=>x.o===o);
 if(!out)return 1+e.alivePlayers().filter(p=>p!==o&&!e.over).length;
 let n=0;for(const p of e.players){if(p.id===o)continue;const x=G.elim.find(y=>y.o===p.id);if(!x||x.at>out.at)n++}
 return n+1;
}

/* ============================================================
   광고 (Google AdMob)
   · 보상형: 끝까지 보면 🪙20, 하루 최대 7회 · 필수(전면): 대전 5판마다 1번

   ※ 출시 전: testing을 false로, 아래 ID를 AdMob 콘솔의 내 광고 단위 ID로 바꾸세요 (지금 값은 Google 공식 테스트 ID)
============================================================ */
const AD_CFG={
 testing:true,
 reward:{android:"ca-app-pub-3940256099942544/5224354917",ios:"ca-app-pub-3940256099942544/1712485313"},
 inter:{android:"ca-app-pub-3940256099942544/1033173712",ios:"ca-app-pub-3940256099942544/4411468910"},

const Ads={
 P:null,ready:false,busy:false,platform:"web",loaded:{reward:false,inter:false},
 async init(){
  const P=Native?.Plugins?.AdMob;if(!P)return;
  this.P=P;this.platform=(Native.getPlatform&&Native.getPlatform())||"android";
  try{
   if(this.platform==="ios"){try{const st=await P.trackingAuthorizationStatus();if(st&&st.status==="notDetermined")await P.requestTrackingAuthorization()}catch(e){}}
   await P.initialize({initializeForTesting:AD_CFG.testing});
   try{const ci=await P.requestConsentInfo();if(ci&&ci.isConsentFormAvailable&&ci.status==="REQUIRED")await P.showConsentForm()}catch(e){}   // EU 동의(UMP)
   this.ready=true;this.preload("reward");this.preload("inter");
  }catch(e){console.warn("AdMob init",e)}
 },
 unit(k){return AD_CFG[k][this.platform==="ios"?"ios":"android"]},
 preload(k){
  if(!this.ready||this.loaded[k])return;
  const opt={adId:this.unit(k),isTesting:AD_CFG.testing};
  (k==="reward"?this.P.prepareRewardVideoAd(opt):this.P.prepareInterstitial(opt)).then(()=>{this.loaded[k]=true}).catch(e=>{this.loaded[k]=false;console.warn("AdMob load",k,e)});
 },
 /* 지정한 이벤트 중 하나가 올 때까지 기다림 (광고가 닫힐 때까지) */
 waitEvents(names,ms){
  return new Promise(res=>{const hs=[];let done=false;const fin=v=>{if(done)return;done=true;hs.forEach(h=>h.then?h.then(x=>x.remove()):h.remove&&h.remove());res(v)};
   names.forEach(n=>hs.push(this.P.addListener(n,()=>fin(n))));setTimeout(()=>fin("timeout"),ms)});
 },
 pauseGameAudio(){Sound.stopMusic()},
 resumeGameAudio(){if(Sound.music)Sound.startMusic(isActive("game")?"game":"menu")},
 /* 보상형: 끝까지 봤으면 true */
 async showReward(){
  if(this.busy)return false;this.busy=true;this.pauseGameAudio();
  try{
   if(!this.ready)return await fakeAd("reward");
   const P=this.P;let got=false;
   const hr=P.addListener("onRewardedVideoAdReward",()=>{got=true});
   const closed=this.waitEvents(["onRewardedVideoAdDismissed","onRewardedVideoAdFailedToShow"],120000);
   if(!this.loaded.reward)await P.prepareRewardVideoAd({adId:this.unit("reward"),isTesting:AD_CFG.testing});
   this.loaded.reward=false;
   const item=await P.showRewardVideoAd();if(item&&item.amount!=null)got=true;
   await closed;(await hr).remove();
   return got;
  }catch(e){console.warn("AdMob reward",e);return false}
  finally{this.busy=false;this.resumeGameAudio();setTimeout(()=>this.preload("reward"),800)}
 },
 /* 전면(필수) 광고: 닫힐 때까지 기다림 · 실패해도 게임은 계속 */
 async showInter(){
  if(this.busy)return;this.busy=true;this.pauseGameAudio();
  try{
   if(!this.ready){await fakeAd("inter");return}
   if(!this.loaded.inter){try{await this.P.prepareInterstitial({adId:this.unit("inter"),isTesting:AD_CFG.testing})}catch(e){return}}
   this.loaded.inter=false;
   const closed=this.waitEvents(["interstitialAdDismissed","interstitialAdFailedToShow"],90000);
   await this.P.showInterstitial();await closed;
  }catch(e){console.warn("AdMob interstitial",e)}
  finally{this.busy=false;this.resumeGameAudio();setTimeout(()=>this.preload("inter"),800)}
 }
};

  ctx.font=`${Math.round(m.r*2.2)}px sans-serif`;ctx.textAlign="center";ctx.textBaseline="top";ctx.fillText("👆",m.x+m.r*.3,m.y+m.r*.2+Math.sin(now/200)*4/z);ctx.restore();return;
 }
 const{m,f}=best,nx=(f.x-m.x)/best.d,ny=(f.y-m.y)/best.d,pull=pullMaxPx()/view.zoom*.75,z=view.zoom;
 const t=(now%1800)/1800,k=t<.15?0:t<.6?(t-.15)/.45:1,a=t<.1?t/.1:t>.8?Math.max(0,1-(t-.8)/.12):1;
 const hx=m.x-nx*pull*k,hy=m.y-ny*pull*k;
 ctx.save();ctx.globalAlpha=a;
 ctx.beginPath();ctx.arc(f.x,f.y,f.r+(5+3*Math.sin(now/150))/z,0,Math.PI*2);ctx.strokeStyle="#ff9a86";ctx.lineWidth=2/z;ctx.setLineDash([4/z,4/z]);ctx.stroke();ctx.setLineDash([]);
 ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(hx,hy);ctx.strokeStyle="rgba(255,255,255,.7)";ctx.lineWidth=2/z;ctx.setLineDash([3/z,5/z]);ctx.stroke();ctx.setLineDash([]);
 if(k>.5){const len=m.r*1.5+k*m.r*2.5,tx=m.x+nx*len,ty=m.y+ny*len;ctx.beginPath();ctx.moveTo(m.x+nx*m.r*1.1,m.y+ny*m.r*1.1);ctx.lineTo(tx,ty);ctx.strokeStyle="#f3c552";ctx.lineWidth=3.5/z;ctx.lineCap="round";ctx.stroke()}
 ctx.font=`${Math.round(m.r*2.2)}px sans-serif`;ctx.textAlign="center";ctx.textBaseline="top";ctx.fillText("👆",hx,hy-m.r*.3);
 ctx.restore();
}
function finishTutorial(won){
 acc.tutorialDone=true;let reward=0;
 if(!acc.tutorialRewarded){acc.tutorialRewarded=true;reward=earn(TUTORIAL_REWARD)}
 save();Sound.play(won?"win":"lose");setCoach(null);
 queueModal({ico:won?"🎉":"👍",title:T("tut_done_t"),body:T(won?"tut_done_win":"tut_done_lose"),reward:reward?"🪙 +"+reward:"",sound:reward?"levelup":null,
  onOk:()=>{cleanupGame();go("home");if(reward)floatDelta(reward)}});
}

$("loadingStatus").textContent=T("loading_status");$("loadingTip").textContent=T("loading_tip");
(function boot(){
 const fill=$("loadingFill");let p=0;
 const iv=setInterval(()=>{
  p=Math.min(100,p+18+Math.random()*14);fill.style.width=p+"%";
  if(p<100)return;
  clearInterval(iv);$("loadingStatus").textContent=T("loading_ready");
  setTimeout(()=>{
   if(!acc.tutorialDone)tutorialOpen=true;        // 첫 방문: 출석 보상보다 튜토리얼 먼저
   go("home");
   /* 처음 접속한 계정: 언어 선택 → 개인정보 처리방침 동의 → (그 언어로) 튜토리얼 */
   if(!acc.tutorialDone)setTimeout(()=>{if(!acc.consent)openOnboarding();else openTutorial()},200);
  },260);
 },120);
})();
