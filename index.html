<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1420">
<title>알까기</title>
<style>
:root{
  --bg:#0b1420;--bg-deep:#081019;--panel:#132132;--panel2:#18293c;--line:#27405c;--line-soft:#1e3247;
  --gold:#64f3d0;--gold2:#55bfff;--text:#edf7ff;--text-dim:#8ea3bd;--text-faint:#5b708b;
  --danger:#ff5c78;--safe:#64f3d0;--warn:#ffd166;--coin:#ffd166;
  --p1:#4fb2ff;--p2:#ff5c7a;--p3:#ffd166;--p4:#7ee08a;--p5:#c084fc;--p6:#5ce1ff;--p7:#ff9f5c;--p8:#e6e6ea;
  --radius:18px;--radius-sm:12px;font-size:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;min-width:0}
body{
  margin:0;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);
  background-image:radial-gradient(130% 80% at 50% -12%,#1b3550 0%,#101f30 45%,var(--bg) 100%);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:relative;width:100%;height:100%;max-width:560px;min-width:0;margin:0 auto;overflow:hidden}
@media (min-width:600px){#app{box-shadow:0 0 0 1px #ffffff0c,0 30px 90px #00000066}}
.screen{position:absolute;inset:0;display:none;flex-direction:column;width:100%;min-width:0}
.screen.active{display:flex}
.fade-in{animation:fadeIn .26s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- loading ---------- */
#screen-loading{background:radial-gradient(110% 85% at 50% 0%,#173c5c 0%,#0b1827 52%,#050b12 100%);align-items:center;justify-content:center;padding:22px}
.loading-card{width:min(88vw,360px);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.loading-art{width:min(62vw,230px);aspect-ratio:1;border-radius:32px;overflow:hidden;border:1px solid #ffffff18;box-shadow:0 18px 70px #0008,0 0 0 1px #64f3d022;background:#08131e;position:relative}
.loading-art svg,.loading-art img{width:100%;height:100%;display:block;object-fit:cover}
.loading-logo{font-size:34px;font-weight:900;letter-spacing:-1px;background:linear-gradient(180deg,#fff,#8ef9df);-webkit-background-clip:text;background-clip:text;color:transparent}
.loading-sub{font-size:10px;color:#6e8aa6;letter-spacing:3.2px;text-transform:uppercase}
.loading-status{font-size:12px;color:#b8cbe0;min-height:18px}
.loading-bar{width:min(72vw,260px);height:6px;border-radius:99px;background:#0a1420;border:1px solid #21364c;overflow:hidden}
.loading-bar i{display:block;width:0;height:100%;border-radius:99px;background:linear-gradient(90deg,#55bfff,#64f3d0);transition:width .25s ease}
.loading-tip{font-size:11px;color:#607993;max-width:290px;line-height:1.55}

/* ---------- common ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 6px}
.backbtn{width:38px;height:38px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1}
.screen-title{font-size:18px;font-weight:800;letter-spacing:-.3px}
.topbar .spacer{flex:1}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 16px calc(28px + env(safe-area-inset-bottom));touch-action:pan-y;-webkit-overflow-scrolling:touch;width:100%;min-width:0}
.content::-webkit-scrollbar{display:none}
.coin-pill{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:14px;color:var(--coin);background:#2a230f;border:1px solid #ffd16644;padding:6px 11px;border-radius:99px;white-space:nowrap}
.coin-pill.flash{animation:coinFlash .7s ease}
@keyframes coinFlash{40%{transform:scale(1.18);filter:brightness(1.7)}}
.coin-plus,.coin-minus{position:fixed;right:22px;top:calc(64px + env(safe-area-inset-top));font-weight:900;font-size:20px;z-index:9999;pointer-events:none;animation:coinFloat 1.15s ease forwards;text-shadow:0 0 14px currentColor}
.coin-plus{color:var(--coin)}.coin-minus{color:#ff6688}
@keyframes coinFloat{0%{opacity:0;transform:translateY(10px) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translateY(-38px) scale(1.05)}}
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 9px;font-size:14px;font-weight:800}
.section-title small{font-size:11px;color:var(--text-faint);font-weight:600}
.badge-dot{position:absolute;top:10px;right:10px;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--danger);color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #0b1420;animation:pop .3s ease both}

/* ---------- menu ---------- */
.menu-head{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 2px 4px}
.avatar{position:relative;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2b4a63,#101b27);display:flex;align-items:center;justify-content:center;font-size:24px;border:2px solid #64f3d055;flex-shrink:0;box-shadow:0 0 22px #64f3d022}
.lvl-badge{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;color:#041412;background:linear-gradient(180deg,#8affdf,#45d9c1);padding:1px 7px;border-radius:99px;white-space:nowrap;border:2px solid var(--bg)}
.profile-main{flex:1;min-width:0}
.profile-name{font-weight:800;font-size:16px;display:flex;align-items:center;gap:6px;background:none;border:none;padding:0;color:var(--text);max-width:100%}
.profile-name span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-name .pen{font-size:11px;opacity:.45}
.title-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--gold);margin-top:3px}
.xp-bar{height:7px;border-radius:99px;background:#0d1926;margin-top:6px;overflow:hidden;border:1px solid var(--line-soft);position:relative}
.xp-fill{height:100%;background:linear-gradient(90deg,#55bfff,#64f3d0);width:0;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 10px #64f3d088}
.xp-text{font-size:10px;color:var(--text-faint);margin-top:3px}
.logo-row{display:flex;align-items:flex-end;justify-content:space-between;margin:14px 2px 10px}
h1.logo{font-size:34px;font-weight:900;letter-spacing:-1.5px;margin:0;line-height:1;background:linear-gradient(180deg,#fff,#9df9eb 78%);-webkit-background-clip:text;background-clip:text;color:transparent}
.quick-strip{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.qchip{font-size:11px;font-weight:700;color:var(--text-dim);background:var(--panel);border:1px solid var(--line-soft);padding:5px 9px;border-radius:99px;white-space:nowrap}
.qchip.hot{color:#ffb86b;border-color:#ff9f5c55;background:#2b1a0f}
.hero-play{position:relative;overflow:hidden;width:100%;text-align:left;border:1px solid #64f3d066;border-radius:22px;padding:20px 18px;background:linear-gradient(135deg,#123f45 0%,#153356 55%,#1b2150 100%);color:var(--text);display:flex;align-items:center;gap:14px;box-shadow:0 14px 40px #00000055,inset 0 1px 0 #ffffff14}
.hero-play:active{transform:scale(.985)}
.hero-play:before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff1c,transparent);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.hero-ico{font-size:34px;width:60px;height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:#0a1a2a88;border:1px solid #ffffff18;flex-shrink:0}
.hero-main{flex:1;min-width:0}
.hero-main b{display:block;font-size:20px;font-weight:900;letter-spacing:-.4px}
.hero-main span{display:block;font-size:12px;color:#b7d3e8;margin-top:3px;line-height:1.4}
.hero-main .hero-meta{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.hero-main .hero-meta i{font-style:normal;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:99px;background:#00000033;border:1px solid #ffffff1a;color:#dff}
.hero-go{font-size:26px;color:var(--gold);flex-shrink:0}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.menu-card{background:linear-gradient(145deg,#1b2f45,#111e2c);border:1px solid var(--line);border-radius:var(--radius);padding:15px 14px;text-align:left;color:var(--text);display:flex;flex-direction:column;gap:5px;min-height:92px;position:relative;overflow:hidden}
.menu-card:active{transform:scale(.985)}
.menu-card:after{content:"";position:absolute;inset:auto -30% -70% 30%;height:90px;background:radial-gradient(circle,#64f3d01c,transparent 65%)}
.menu-card .ico{font-size:22px}
.menu-card b{font-size:15px}
.menu-card span{font-size:11px;color:var(--text-dim);line-height:1.4}
.mission-list{display:flex;flex-direction:column;gap:8px}
.mission{display:flex;align-items:center;gap:11px;background:linear-gradient(145deg,rgba(24,41,60,.96),rgba(14,25,38,.96));border:1px solid var(--line-soft);border-radius:14px;padding:11px 12px}
.mission.done{border-color:#64f3d066;box-shadow:0 0 0 1px #64f3d022,0 0 18px #64f3d014}
.mission.claimed{opacity:.5}
.mission .m-ico{width:36px;height:36px;border-radius:11px;background:#0f1d2b;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.mission .m-main{flex:1;min-width:0}
.mission .m-name{font-size:12.5px;font-weight:700;line-height:1.3}
.mission .m-bar{height:5px;border-radius:99px;background:#0d1926;margin-top:6px;overflow:hidden}
.mission .m-bar i{display:block;height:100%;background:linear-gradient(90deg,#55bfff,#64f3d0);border-radius:99px;transition:width .5s ease}
.mission .m-prog{font-size:10px;color:var(--text-faint);margin-top:3px}
.claim-btn{flex-shrink:0;min-width:70px;padding:8px 10px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--coin);font-weight:800;font-size:12px;text-align:center}
.claim-btn.ready{background:linear-gradient(180deg,#ffe08a,#f2b544);color:#2a1a00;border-color:#ffd16699;animation:pulseBtn 1.3s ease-in-out infinite}
.claim-btn.ok{color:var(--gold);background:#123437;border-color:#64f3d055}
@keyframes pulseBtn{50%{box-shadow:0 0 0 5px #ffd16622;transform:scale(1.04)}}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat-cell{border-radius:13px;padding:10px 4px;text-align:center;background:linear-gradient(145deg,rgba(24,41,60,.96),rgba(14,25,38,.96));border:1px solid var(--line-soft)}
.stat-num{font-size:16px;font-weight:900}
.stat-label{font-size:10px;color:var(--text-faint);margin-top:2px}
.settings-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:18px;flex-wrap:wrap}
.tg-group{display:flex;gap:6px}
.tg{border:1px solid var(--line);background:var(--panel);color:var(--text-faint);border-radius:20px;padding:6px 11px;font-size:12px;display:flex;align-items:center;gap:5px}
.tg.on{color:var(--gold);border-color:#64f3d066;background:#12343780}
.lang-row{display:flex;gap:4px}
.lang-row button{font-size:11.5px;color:var(--text-faint);padding:5px 9px;border-radius:20px;border:1px solid transparent;background:none}
.lang-row button.active{color:var(--gold);font-weight:800;border-color:#64f3d055;background:#12343766}
.acc-foot{text-align:center;font-size:10.5px;color:var(--text-faint);margin-top:16px;opacity:.8}

/* ---------- config ---------- */
.intro{font-size:12.5px;color:var(--text-dim);line-height:1.6;margin:2px 0 16px;white-space:pre-line}
.field{margin-bottom:18px}
.field-label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--text-dim);margin-bottom:8px}
.field-label b{color:var(--text);font-size:14px}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:10px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:20px}
.stepper .val{font-size:22px;font-weight:900;min-width:44px;text-align:center}
.dots-preview{display:flex;justify-content:center;gap:5px;margin-top:8px;flex-wrap:wrap}
.dots-preview i{width:10px;height:10px;border-radius:50%;box-shadow:0 0 8px currentColor}
.chip-row{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:72px;padding:10px 8px;border-radius:12px;border:1px solid var(--line-soft);background:var(--panel);text-align:center;font-size:12.5px;color:var(--text-dim)}
.chip small{display:block;font-size:10px;color:var(--text-faint);margin-top:2px}
.chip.active{border-color:var(--gold);color:var(--gold);background:#123437}
.chip.locked{border-color:#ff5c7866;color:#ff8da1;background:#2a1119;cursor:default}
.lock-note{font-size:11px;color:var(--text-faint);margin-top:6px}
.reward-preview{display:flex;gap:8px;justify-content:center;margin:4px 0 12px;flex-wrap:wrap}
.reward-preview span{font-size:12px;font-weight:800;padding:6px 11px;border-radius:99px;background:var(--panel);border:1px solid var(--line-soft)}
.reward-preview .c{color:var(--coin)}.reward-preview .x{color:var(--gold2)}
.primary-btn{width:100%;padding:16px;border-radius:15px;border:1px solid #69f4d555;background:linear-gradient(180deg,#8affdf,#45d9c1);color:#041412;font-weight:900;font-size:15.5px;margin-top:6px;box-shadow:0 10px 30px #45d9c133}
.primary-btn:active{transform:scale(.99)}
.primary-btn:disabled{opacity:.45}
.ghost-btn{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text-dim);font-weight:700;font-size:14px;margin-top:10px}
.player-list{display:flex;flex-direction:column;gap:8px}
.player-row{display:flex;align-items:center;gap:10px;border-radius:12px;padding:9px 12px;background:linear-gradient(145deg,rgba(24,41,60,.96),rgba(14,25,38,.96));border:1px solid var(--line-soft)}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.player-row .pname{flex:1;font-size:13.5px}
.switch{width:44px;height:25px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);position:relative;flex-shrink:0}
.switch i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--text-dim);transition:.15s}
.switch.on{background:#123437;border-color:var(--gold)}
.switch.on i{left:21px;background:var(--gold)}
.switch.locked{opacity:.35}
.sw-label{font-size:10.5px;color:var(--text-faint);width:30px;text-align:right}

/* ---------- shop ---------- */
.shop-tabs,.tabs{display:flex;gap:8px;margin:4px 0 14px}
.shop-tabs .chip,.tabs .chip{min-width:0}
.shop-note{font-size:11.5px;color:var(--text-faint);line-height:1.5;margin:0 0 14px;white-space:pre-line}
.shop-list{display:flex;flex-direction:column;gap:10px}
.shop-item{border:1px solid var(--line-soft);background:linear-gradient(145deg,rgba(24,41,60,.96),rgba(14,25,38,.96));border-radius:15px;padding:13px 14px;display:flex;gap:12px;align-items:flex-start}
.shop-item.eq{border-color:#64f3d066}
.si-ico{width:42px;height:42px;border-radius:12px;background:#0f1d2b;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.si-main{flex:1;min-width:0}
.si-title{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.si-lv{font-size:10.5px;color:var(--gold);border:1px solid #64f3d055;border-radius:20px;padding:1px 7px}
.si-desc{font-size:11.5px;color:var(--text-dim);line-height:1.45;margin-top:3px}
.si-eff{font-size:11px;color:var(--gold2);margin-top:4px}
.pips{display:flex;gap:3px;margin-top:7px}
.pips i{flex:1;height:4px;border-radius:3px;background:#0d1926;border:1px solid var(--line-soft)}
.pips i.on{background:linear-gradient(90deg,#55bfff,#64f3d0);border-color:transparent}
.buy-btn{flex-shrink:0;align-self:center;min-width:84px;padding:10px;border-radius:12px;border:1px solid #69f4d555;background:linear-gradient(180deg,#8affdf,#45d9c1);color:#041412;font-weight:800;font-size:12.5px;text-align:center;line-height:1.3}
.buy-btn.locked{background:var(--panel2);border-color:var(--line);color:var(--text-faint)}
.buy-btn.max{background:#123437;border-color:#64f3d055;color:var(--gold)}
.buy-btn.equipped{background:#123437;border-color:#64f3d0;color:var(--gold)}
.skin-preview{width:36px;height:36px;border-radius:50%;box-shadow:inset -3px -3px 6px #0008,inset 3px 3px 6px #ffffff55}

/* ---------- achievements ---------- */
.ach{display:flex;align-items:center;gap:11px;background:linear-gradient(145deg,rgba(24,41,60,.96),rgba(14,25,38,.96));border:1px solid var(--line-soft);border-radius:14px;padding:11px 12px}
.ach .m-ico{width:40px;height:40px;border-radius:12px;background:#0f1d2b;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;filter:grayscale(1);opacity:.55}
.ach.reached .m-ico,.ach.claimed .m-ico{filter:none;opacity:1}
.ach.reached{border-color:#ffd16677}
.ach.claimed{opacity:.6}
.bonus-card{margin-top:10px;display:flex;align-items:center;gap:11px;border:1px dashed #ffd16666;background:#2a230f55;border-radius:14px;padding:12px}
.bonus-card .m-main{flex:1;font-size:12px;color:var(--text-dim)}
.bonus-card b{display:block;color:var(--coin);font-size:13.5px}

/* ---------- game ---------- */
#screen-game{background:radial-gradient(120% 70% at 50% 42%,#12253a 0%,#0a1420 55%,#070e17 100%)}
.hud-top{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 10px 0;z-index:5;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.hud-status{display:flex;align-items:center;gap:6px}
.hud-status .grow{flex:1}
.hud-players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:2px;max-height:190px;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;align-content:start;pointer-events:auto}
.hud-players.many{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.hud-players.is-hidden{display:none}
.hud-chip{min-width:0;display:flex;align-items:center;gap:6px;background:rgba(12,22,34,.9);backdrop-filter:blur(12px);border:1px solid #26384d;border-radius:12px;padding:6px 9px 6px 7px;opacity:.55;transition:.2s}
.hud-players.many .hud-chip{padding:5px 6px;gap:5px;border-radius:10px}
.hud-chip.turn{opacity:1;border-color:var(--gold);box-shadow:0 0 0 1px #64f3d055,0 0 18px #64f3d022}
.hud-chip.me .nm{color:#fff}
.hud-chip.dead{opacity:.2;filter:grayscale(1)}
.hud-chip .dot{width:10px;height:10px;box-shadow:0 0 8px currentColor}
.hud-chip .nm{font-size:11px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud-chip .cnt{font-size:9.5px;color:var(--text-dim)}
.hud-chip>div:last-child{min-width:0}
.icon-btn{pointer-events:auto;background:rgba(12,22,34,.9);border:1px solid var(--line);color:var(--text-dim);min-width:34px;height:34px;border-radius:10px;font-size:14px;padding:0 8px}
.icon-btn.on{color:var(--gold);border-color:#64f3d066}
.hud-toggle{pointer-events:auto;background:rgba(12,22,34,.92);border:1px solid var(--line);color:var(--text-dim);height:34px;padding:0 10px;border-radius:10px;font-size:10.5px;font-weight:700;white-space:nowrap}
.mode-pill{font-size:10.5px;font-weight:800;color:var(--text-dim);background:rgba(12,22,34,.9);border:1px solid var(--line);padding:0 9px;height:34px;display:flex;align-items:center;border-radius:10px;white-space:nowrap}
.mode-pill b{color:var(--coin);margin-left:5px}
.turn-banner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);z-index:6;background:rgba(10,20,32,.92);border:1px solid var(--gold);color:var(--gold);font-weight:900;font-size:15px;padding:11px 22px;border-radius:12px;opacity:0;transition:.22s;pointer-events:none;white-space:nowrap;letter-spacing:.3px;box-shadow:0 10px 40px #0008}
.turn-banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.turn-banner.mine{background:linear-gradient(180deg,#8affdf,#45d9c1);color:#041412;border-color:transparent}
#boardWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
canvas#board{touch-action:none}
.hud-bottom{position:absolute;left:0;right:0;bottom:0;padding:0 16px calc(18px + env(safe-area-inset-bottom));z-index:5;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.power-wrap{width:100%;max-width:300px;display:flex;align-items:center;gap:8px;opacity:.35;transition:.15s}
.power-wrap.show{opacity:1}
.power-wrap.off .turn-timer{opacity:.2}
.power-bar{flex:1;height:9px;border-radius:8px;background:#0d1926;overflow:hidden;border:1px solid var(--line-soft)}
.power-fill{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#64f3d0,#ffd166,#ff5c78)}
.power-pct{font-size:11px;color:var(--text-dim);min-width:34px;text-align:right}
.hint{font-size:11.5px;color:var(--text-faint);text-align:center}
.turn-timer{width:36px;height:36px}
.toast-stack{position:absolute;top:calc(118px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%}
.toast{background:rgba(12,22,34,.96);border:1px solid var(--line);padding:9px 15px;border-radius:12px;font-size:12.5px;font-weight:700;text-align:center;animation:fadeIn .2s ease both;box-shadow:0 8px 24px #0006;max-width:100%}
.toast.gold{border-color:#ffd16688;color:#ffe3a0}
.toast.good{border-color:#64f3d088;color:#b8fff0}

/* ---------- result ---------- */
.result-content{display:flex;flex-direction:column;align-items:center;padding-top:calc(24px + env(safe-area-inset-top))}
.result-hero{text-align:center;margin-bottom:14px}
.result-medal{font-size:64px;animation:pop .5s ease both}
.result-title{font-size:30px;font-weight:900;letter-spacing:-.6px;margin-top:4px}
.result-title.win{background:linear-gradient(180deg,#fff,#8ef9df);-webkit-background-clip:text;background-clip:text;color:transparent}
.result-title.lose{color:#ff8da1}
.result-sub{font-size:13px;color:var(--text-dim);margin-top:4px}
.streak-chip{display:inline-block;margin-top:10px;font-size:12px;font-weight:800;padding:5px 12px;border-radius:99px;color:#ffb86b;background:#2b1a0f;border:1px solid #ff9f5c55}
.streak-chip:empty{display:none}
.result-card{width:100%;max-width:380px;background:linear-gradient(145deg,rgba(24,41,60,.96),rgba(14,25,38,.96));border:1px solid var(--line-soft);border-radius:18px;padding:6px 16px;margin-bottom:10px}
.result-card:empty{display:none}
.rw-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:13px;color:var(--text-dim);border-bottom:1px solid #ffffff0a;animation:fadeIn .3s ease both}
.rw-row b{color:var(--coin)}
.rw-row.neg b{color:#ff8da1}
.rw-row.total{border-bottom:none;font-size:15px;color:var(--text);font-weight:800}
.rw-row.total b{font-size:19px}
.xp-card{width:100%;max-width:380px;background:linear-gradient(145deg,rgba(24,41,60,.96),rgba(14,25,38,.96));border:1px solid var(--line-soft);border-radius:18px;padding:13px 16px;margin-bottom:10px}
.xp-card .xp-head{display:flex;justify-content:space-between;font-size:13px;font-weight:800}
.xp-card .xp-head span{color:var(--gold2)}
.result-actions{width:100%;max-width:380px;margin-top:6px}
.result-actions .row{display:flex;gap:8px}
.result-actions .row .ghost-btn{flex:1}

/* ---------- modal ---------- */
.modal{position:absolute;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 42%,rgba(100,243,208,.10),rgba(2,6,12,.82) 60%);backdrop-filter:blur(6px)}
.modal.show{display:flex;animation:fadeIn .2s ease both}
.modal-card{width:min(92%,340px);padding:26px 20px 20px;border-radius:24px;border:1px solid #64f3d066;background:linear-gradient(160deg,rgba(24,41,60,.99),rgba(9,17,27,.99));box-shadow:0 20px 70px #0009;text-align:center}
.modal-card .m-ico{font-size:56px;animation:pop .45s ease both}
.modal-card .m-title{font-size:22px;font-weight:900;margin-top:6px}
.modal-card .m-body{font-size:13px;color:var(--text-dim);margin-top:6px;line-height:1.55;white-space:pre-line}
.modal-card .m-reward{display:inline-block;margin-top:14px;font-size:22px;font-weight:900;color:var(--coin);padding:8px 18px;border-radius:99px;background:#2a230f;border:1px solid #ffd16655}
.modal-card .m-reward:empty{display:none}
.modal-card input{width:100%;margin-top:14px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#0b1521;color:var(--text);font-size:15px;font-weight:700;outline:none;user-select:text;-webkit-user-select:text}
.modal-card input:focus{border-color:var(--gold)}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.modal-actions button{flex:1;padding:13px;border-radius:13px;font-weight:900;font-size:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
.modal-actions button.ok{border-color:#69f4d555;background:linear-gradient(180deg,#8affdf,#45d9c1);color:#041412}
.modal-actions button.danger{background:var(--danger);border-color:var(--danger);color:#2a0507}
</style>
</head>

<script>
"use strict";
/* ============================================================
   알까기 — 오프라인 버전
   · 서버 없이 기기 안에서 모든 물리/AI/계정을 처리합니다.
   · 계정은 기기당 1개 (localStorage에 저장)
============================================================ */
const $=id=>document.getElementById(id);
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* ============================================================
   설정 상수
============================================================ */
const rootCss=getComputedStyle(document.documentElement);

   사운드 (Web Audio · 외부 파일 없음)
============================================================ */
const Sound={
 ctx:null,master:null,musicGain:null,sfxGain:null,
 music:lsGet("alkkagi_music")!=="off",
 sfx:lsGet("alkkagi_sfx")!=="off",
 timer:null,step:0,bar:0,nextTime:0,mode:null,lastHit:0,
 init(){
  if(this.ctx)return;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
  try{this.ctx=new AC()}catch(e){return}
  this.master=this.ctx.createGain();this.master.gain.value=.9;this.master.connect(this.ctx.destination);
  this.musicGain=this.ctx.createGain();this.musicGain.gain.value=0;this.musicGain.connect(this.master);
  this.sfxGain=this.ctx.createGain();this.sfxGain.gain.value=.55;this.sfxGain.connect(this.master);
 },
 unlock(){this.init();if(this.ctx&&this.ctx.state==="suspended")this.ctx.resume();if(this.music&&!this.timer&&this.mode)this.startMusic(this.mode)},
 tone(f,t,dur,type,gain,dest,slideTo){
  if(!this.ctx)return;
  const o=this.ctx.createOscillator(),g=this.ctx.createGain();
  o.type=type||"triangle";o.frequency.setValueAtTime(f,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t+dur);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(gain,t+Math.min(.012,dur*.25));
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest||this.sfxGain);o.start(t);o.stop(t+dur+.03);
 },
 noise(t,dur,gain,freq,dest,q){
  if(!this.ctx)return;
  const len=Math.max(1,Math.floor(this.ctx.sampleRate*dur));
  const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const src=this.ctx.createBufferSource();src.buffer=buf;
  const f=this.ctx.createBiquadFilter();f.type="bandpass";f.frequency.value=freq||1400;f.Q.value=q||.8;
  const g=this.ctx.createGain();g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f);f.connect(g);g.connect(dest||this.sfxGain);src.start(t);src.stop(t+dur+.02);
 },
 play(name,arg){
  if(!this.sfx)return; this.init(); if(!this.ctx)return;
  const t=this.ctx.currentTime;
  switch(name){
   case"ui":       this.tone(880,t,.06,"square",.10); this.tone(1320,t+.03,.06,"square",.06); break;
   case"back":     this.tone(520,t,.08,"square",.08,null,320); break;
   case"shoot":{   const p=Math.max(.2,Math.min(1,arg||.6));
                   this.tone(180+520*p,t,.14,"sawtooth",.13,null,120);
                   this.noise(t,.11,.10,900+900*p,null,1.1); break;}
   case"hit":{     const p=Math.max(.08,Math.min(1,arg||.4));
                   if(t-this.lastHit<.022)return; this.lastHit=t;
                   this.tone(420+620*p,t,.055+.05*p,"triangle",.07+.16*p,null,220);
                   this.noise(t,.045,.05+.09*p,2200+1800*p,null,1.4); break;}
   case"bumper":   this.tone(1100,t,.09,"square",.10,null,1800); break;
   case"out":      this.tone(660,t,.20,"sawtooth",.13,null,150);
                   this.noise(t+.01,.22,.12,600,null,.7);
                   this.tone(190,t+.06,.20,"sine",.14,null,90); break;
   case"myout":    this.tone(330,t,.34,"sawtooth",.14,null,70); this.noise(t,.3,.1,400,null,.6); break;
   case"turn":     this.tone(700,t,.07,"sine",.07); this.tone(1050,t+.05,.09,"sine",.06); break;
   case"coin":     this.tone(1180,t,.07,"square",.09); this.tone(1580,t+.06,.10,"square",.08); break;
   case"claim":    [0,7,12,19].forEach((s,i)=>this.tone(880*Math.pow(2,s/12),t+i*.05,.12,"square",.08)); break;
   case"buy":      [0,4,7,12].forEach((s,i)=>this.tone(523.25*Math.pow(2,s/12),t+i*.055,.16,"square",.09)); break;
   case"combo":    [0,4,7,12,16,19].forEach((s,i)=>this.tone(659*Math.pow(2,s/12),t+i*.045,.14,"sawtooth",.08)); break;
   case"levelup":  [0,4,7,12,7,12,16,24].forEach((s,i)=>this.tone(523.25*Math.pow(2,s/12),t+i*.07,.22,"triangle",.13)); break;
   case"win":      [0,4,7,12,16].forEach((s,i)=>this.tone(392*Math.pow(2,s/12),t+i*.09,.34,"triangle",.14)); break;
   case"lose":     [0,-3,-7].forEach((s,i)=>this.tone(392*Math.pow(2,s/12),t+i*.14,.4,"sawtooth",.10)); break;
   case"tick":     this.tone(1400,t,.03,"square",.05); break;
  }
 },
 ROOTS:[0,0,5,3],
 startMusic(mode){
  this.mode=mode;
  if(!this.ctx)return;
  if(!this.music){this.musicGain.gain.value=0;return}
  this.musicGain.gain.cancelScheduledValues(this.ctx.currentTime);
  this.musicGain.gain.setTargetAtTime(mode==="game"?.19:.13,this.ctx.currentTime,.35);
  if(this.timer)return;
  this.step=0;this.bar=0;this.nextTime=this.ctx.currentTime+.08;
  this.timer=setInterval(()=>this.schedule(),25);
 },
 stopMusic(){
  if(this.timer){clearInterval(this.timer);this.timer=null}
  if(this.musicGain&&this.ctx)this.musicGain.gain.setTargetAtTime(0,this.ctx.currentTime,.2);
 },
 setMusic(on){this.music=on;lsSet("alkkagi_music",on?"on":"off");if(on){this.init();this.startMusic(this.mode||"menu")}else this.stopMusic()},
 setSfx(on){this.sfx=on;lsSet("alkkagi_sfx",on?"on":"off");if(on)this.play("ui")},
 schedule(){
  if(!this.ctx)return;
  const sixteenth=60/126/4;
  while(this.nextTime<this.ctx.currentTime+.12){
   this.playStep(this.step,this.nextTime);
   this.step=(this.step+1)%16;
   if(this.step===0)this.bar=(this.bar+1)%4;
   this.nextTime+=sixteenth;
  }
 },
 playStep(s,t){
  const g=this.musicGain,full=this.mode==="game";
  const root=110*Math.pow(2,this.ROOTS[this.bar]/12);
  const PENTA=[0,3,5,7,10,12,15];
  if(s%4===0||s===6||s===14) this.tone(root/2,t,s%4===0?.24:.14,"square",.16,g);
  if(s===0||s===8) [0,7,12].forEach(iv=>this.tone(root*Math.pow(2,iv/12),t,.5,"sine",.05,g));
  const ARP=[0,4,2,5,3,6,4,5,2,4,1,3,0,2,4,6];
  if(full||s%2===0) this.tone(root*2*Math.pow(2,PENTA[ARP[s]]/12),t,.13,"triangle",full?.075:.05,g);
  if(full&&(s===2||s===7||s===10||s===15)) this.tone(root*4*Math.pow(2,PENTA[(ARP[s]+2)%7]/12),t,.17,"square",.045,g);
  if(s%4===0) this.tone(150,t,full?.16:.12,"sine",full?.3:.16,g,48);
  if(full&&(s===4||s===12)) this.noise(t,.13,.16,1900,g,.6);
  if(s%2===1) this.noise(t,.035,full?.055:.03,7500,g,1.2);
 }
};
document.addEventListener("pointerdown",()=>Sound.unlock());

const DEVICE_KEY="alkkagi_device_id_v1",ACC_KEY="alkkagi_account_v2";
function makeId(){return (window.crypto?.randomUUID?.()||("dev-"+Date.now()+"-"+Math.random().toString(36).slice(2))).replace(/-/g,"").slice(0,24)}

function defaultAcc(){return{
 accountId:deviceId,nickname:lsGet("alkkagi_nickname")||"플레이어",createdAt:Date.now(),
 coins:100,xp:0,level:1,wins:0,games:0,curStreak:0,bestStreak:0,playSeconds:0,
 knockouts:0,bestCombo:0,win8:0,practiceGames:0,visitDays:0,lastVisit:"",
 upgrades:{},skins:["basic"],skin:"basic",trails:["none"],trail:"none",
 daily:null,ach:{},achSeen:{}
}}
function loadAcc(){
 const d=defaultAcc();let a=null;
 try{a=JSON.parse(lsGet(ACC_KEY)||"null")}catch(e){a=null}
 if(!a||typeof a!=="object")return d;
 const m={...d,...a};
 m.accountId=deviceId;               // 이 기기에 묶인 단 하나의 계정
 ["coins","xp","level","wins","games","curStreak","bestStreak","playSeconds","knockouts","bestCombo","win8","practiceGames","visitDays"].forEach(k=>{m[k]=Math.max(0,Number(m[k])||0)});
 m.level=Math.max(1,m.level);
 m.upgrades=(a.upgrades&&typeof a.upgrades==="object")?a.upgrades:{};
 m.skins=Array.isArray(a.skins)?a.skins.filter(id=>SKINS.some(s=>s.id===id)):[];if(!m.skins.includes("basic"))m.skins.unshift("basic");
 if(!m.skins.includes(m.skin))m.skin="basic";
 m.trails=Array.isArray(a.trails)?a.trails.filter(id=>TRAILS.some(s=>s.id===id)):[];if(!m.trails.includes("none"))m.trails.unshift("none");
 if(!m.trails.includes(m.trail))m.trail="none";
 m.ach=(a.ach&&typeof a.ach==="object")?a.ach:{};m.achSeen=(a.achSeen&&typeof a.achSeen==="object")?a.achSeen:{};
 return m;
}

/* 날짜 */
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function msUntilMidnight(){const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);return m-n}

/* 레벨 */
function addXP(n){
 const ups=[];acc.xp+=n;
 while(acc.xp>=XP_NEED(acc.level)){acc.xp-=XP_NEED(acc.level);acc.level++;const r=20+acc.level*5;acc.coins+=r;ups.push({level:acc.level,reward:r})}
 return ups;
}

/* 일일 미션 */
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function pickMissions(date){
 let seed=hashStr(date+"|"+deviceId);
 const rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
 const ids=MISSION_POOL.map(m=>m.id);
 for(let i=ids.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
 return ids.slice(0,3);
}
function ensureDaily(){
 const t=todayStr();
 if(!acc.daily||acc.daily.date!==t||!Array.isArray(acc.daily.list)){
  acc.daily={date:t,list:pickMissions(t).map(id=>({id,p:0,c:false})),bonus:false};save();
 }
}
const missionDef=id=>MISSION_POOL.find(m=>m.id===id);
function missionName(d){return T("m_"+d.id,{n:d.n})}
function missionEvent(ev,amt=1){
 ensureDaily();const done=[];
 acc.daily.list.forEach(m=>{
  const d=missionDef(m.id);if(!d||d.ev!==ev||m.c||m.p>=d.n)return;
  m.p=Math.min(d.n,m.p+amt);if(m.p>=d.n)done.push(d);
 });
 if(done.length)save();
 return done;
}

/* 업적 */
function achReached(a){return a.val()>=a.goal}
function checkAchievements(){
 const fresh=[];
 ACHS.forEach(a=>{if(!acc.achSeen[a.id]&&achReached(a)){acc.achSeen[a.id]=true;fresh.push(a)}});
 if(fresh.length){save();fresh.forEach((a,i)=>setTimeout(()=>{showToast(T("ach_toast",{name:T("a_"+a.id)}),"gold");Sound.play("claim")},300+i*600))}
 return fresh;
}
function claimAch(id){
 const a=ACHS.find(x=>x.id===id);if(!a||acc.ach[id]||!achReached(a))return;
 acc.ach[id]=true;acc.coins+=a.reward;save();Sound.play("claim");coinDelta(a.reward);refreshAll();
}
function claimableMissions(){ensureDaily();return acc.daily.list.filter(m=>!m.c&&m.p>=missionDef(m.id).n).length+(canClaimBonus()?1:0)}
function claimableAchs(){return ACHS.filter(a=>!acc.ach[a.id]&&achReached(a)).length}

/* 출석 보상 (하루 1번) */
function checkDailyVisit(){
 const t=todayStr();
 if(acc.lastVisit===t)return;
 if(acc.lastVisit&&t<acc.lastVisit)return;   // 시계를 되돌린 경우 지급하지 않음
 acc.lastVisit=t;acc.visitDays++;acc.coins+=DAILY_VISIT_REWARD;save();
 queueModal({ico:"🎁",title:T("daily_title"),body:T("daily_body",{n:acc.visitDays}),reward:"🪙 +"+DAILY_VISIT_REWARD,okText:T("claim"),onOk:()=>{Sound.play("claim");coinDelta(DAILY_VISIT_REWARD);refreshAll()}});
 checkAchievements();
}

/* 강화 */
function upLevel(id){return acc.upgrades[id]||0}
function upCost(u){const l=upLevel(u.id);return l>=u.max?null:u.costs[l]}
function canAffordAnything(){
 return UPGRADES.some(u=>{const c=upCost(u);return c!==null&&acc.coins>=c})
  ||SKINS.some(s=>!acc.skins.includes(s.id)&&acc.coins>=s.cost)
  ||TRAILS.some(t=>!acc.trails.includes(t.id)&&acc.coins>=t.cost);
}
function myBuffs(){
 return {massBonus:upLevel("mass")*.18,gripBonus:upLevel("grip")*.0030,powerBonus:upLevel("power")*.04,restBonus:upLevel("bounce")*.06,aim:upLevel("aim")>0};
}

  this.playerCount=playerCount;this.stoneCount=stoneCount;
  this.boardPx=boardPx;this.scale=boardPx/BASE_PX;
  this.boardR=boardPx*this.mapDef.radiusRatio;
  this.cx=boardPx/2;this.cy=boardPx/2;
  this.stoneR=this.boardR*STONE_R_RATIO*(1/.42)*.9;
  if(playerCount*stoneCount>16)this.stoneR*=.9;           // 알이 아주 많으면 살짝 작게
  this.bumpers=this.mapDef.bumpers.map(([x,y])=>({x:this.cx+x*boardPx,y:this.cy+y*boardPx,r:this.boardR*.09}));
  this.buffSlot=(buffSlot==null?-1:buffSlot);this.buffs=buffs||null;
  this.stones=[];this.turn=0;this.moving=false;this.winner=null;this.draw=false;
  this.onHit=null;this.onOut=null;this.onShoot=null;this.onBumper=null;
  this._genStones();
 }
 _genStones(){
  const maxR=this.boardR-this.stoneR*1.35,pos=[],minGap=this.stoneR*2.12,total=this.playerCount*this.stoneCount;
  for(let id=0;id<total;id++){
   const owner=Math.floor(id/this.stoneCount);let placed=false;
   for(let attempt=0;attempt<700&&!placed;attempt++){
    const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*maxR*.92;
    const p={x:this.cx+Math.cos(a)*r,y:this.cy+Math.sin(a)*r,owner};
    let ok=true;
    for(const q of pos){if(Math.hypot(p.x-q.x,p.y-q.y)<minGap){ok=false;break}}
    if(ok){for(const b of this.bumpers){if(Math.hypot(p.x-b.x,p.y-b.y)<b.r+this.stoneR*1.25){ok=false;break}}}
    if(ok){pos.push(p);placed=true}
   }
   if(!placed){const a=(id*2.399963229728653)%(Math.PI*2),r=maxR*.55;pos.push({x:this.cx+Math.cos(a)*r,y:this.cy+Math.sin(a)*r,owner})}
  }
  for(let it=0;it<160;it++){
   let moved=false;
   for(let i=0;i<pos.length;i++){
    for(let j=i+1;j<pos.length;j++){
     let dx=pos[j].x-pos[i].x,dy=pos[j].y-pos[i].y,d=Math.hypot(dx,dy);
     if(d<1e-6){dx=Math.cos(i*1.7);dy=Math.sin(i*1.7);d=1e-6}
     if(d<minGap){const k=(minGap-d)/2/d;pos[i].x-=dx*k;pos[i].y-=dy*k;pos[j].x+=dx*k;pos[j].y+=dy*k;moved=true}
    }
    for(const b of this.bumpers){
     const dx=pos[i].x-b.x,dy=pos[i].y-b.y,d=Math.hypot(dx,dy)||1e-6,min=b.r+this.stoneR*1.25;
     if(d<min){pos[i].x=b.x+dx/d*min;pos[i].y=b.y+dy/d*min;moved=true}
    }
    const dx=pos[i].x-this.cx,dy=pos[i].y-this.cy,d=Math.hypot(dx,dy);
    if(d>maxR){pos[i].x=this.cx+dx/d*maxR;pos[i].y=this.cy+dy/d*maxR;moved=true}
   }
   if(!moved)break;
  }
  const bf=this.buffs;
  pos.forEach((p,id)=>{
   const mine=p.owner===this.buffSlot&&!!bf;
   this.stones.push({id,owner:p.owner,x:p.x,y:p.y,vx:0,vy:0,r:this.stoneR,
    m:1+(mine?bf.massBonus:0),fric:this.mapDef.friction-(mine?bf.gripBonus:0),
    rest:COLLISION_RESTITUTION+(mine?bf.restBonus:0),pw:1+(mine?bf.powerBonus:0),alive:true});
  });
 }
 aliveCountFor(p){return this.stones.filter(s=>s.owner===p&&s.alive).length}
 alivePlayers(){return [...new Set(this.stones.filter(s=>s.alive).map(s=>s.owner))]}
 nextTurn(){
  const a=this.alivePlayers();
  if(a.length===0){this.winner=null;this.draw=true;return}
  if(a.length===1){this.winner=a[0];this.draw=false;return}
  for(let i=1;i<=this.playerCount;i++){const t=(this.turn+i)%this.playerCount;if(a.includes(t)){this.turn=t;return}}
 }
 shoot(id,dx,dy){
  const s=this.stones.find(x=>x.id===id&&x.alive);if(!s)return false;
  let d=Math.hypot(dx,dy);if(d<4*this.scale)return false;
  const maxPull=MAX_PULL*this.scale;d=Math.min(d,maxPull);
  const p=Math.pow(d/maxPull,POWER_CURVE),n=Math.hypot(dx,dy),nx=dx/n,ny=dy/n;
  const speed=MAX_SPEED*this.scale*p*(s.pw||1)/(1+((s.m||1)-1)*.25);
  s.vx=nx*speed;s.vy=ny*speed;this.moving=true;
  this.onShoot?.(p,s);
  return true;
 }
 step(){
  if(!this.moving)return false;
  const eps=SETTLE_EPS*this.scale;let any=false;
  for(const s of this.stones){
   if(!s.alive)continue;
   s.x+=s.vx;s.y+=s.vy;
   const f=s.fric||this.mapDef.friction;s.vx*=f;s.vy*=f;
   if(Math.hypot(s.vx,s.vy)<eps){s.vx=0;s.vy=0}else any=true;
  }
  for(const s of this.stones){
   if(!s.alive)continue;
   for(const b of this.bumpers){
    let dx=s.x-b.x,dy=s.y-b.y,d=Math.hypot(dx,dy);const min=b.r+s.r;
    if(d<min){
     if(d<1e-7){dx=1;dy=0;d=1}
     const nx=dx/d,ny=dy/d;s.x=b.x+nx*min;s.y=b.y+ny*min;
     const vn=s.vx*nx+s.vy*ny;
     if(vn<0){s.vx-=(1+BUMPER_RESTITUTION)*vn*nx;s.vy-=(1+BUMPER_RESTITUTION)*vn*ny;this.onBumper?.(Math.min(1,Math.abs(vn)/(MAX_SPEED*this.scale)),b)}
     any=true;
    }
   }
  }
  const a=this.stones.filter(s=>s.alive);
  for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){
   const A=a[i],B=a[j];
   let dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy);const min=A.r+B.r;
   if(d<min){
    if(d<1e-7){const q=(A.id*1103515245+B.id*12345)>>>0,ang=(q%360)*Math.PI/180;dx=Math.cos(ang);dy=Math.sin(ang);d=0}else{dx/=d;dy/=d}
    const nx=dx,ny=dy,ov=min-d;
    A.x-=nx*ov*.5;A.y-=ny*ov*.5;B.x+=nx*ov*.5;B.y+=ny*ov*.5;
    const invM=1/A.m+1/B.m,rel=(B.vx-A.vx)*nx+(B.vy-A.vy)*ny;
    if(rel<0){
     const rest=((A.rest||COLLISION_RESTITUTION)+(B.rest||COLLISION_RESTITUTION))/2,imp=-(1+rest)*rel/invM;
     A.vx-=imp*nx/A.m;A.vy-=imp*ny/A.m;B.vx+=imp*nx/B.m;B.vy+=imp*ny/B.m;
     this.onHit?.(Math.min(1,Math.abs(rel)/(MAX_SPEED*this.scale)),(A.x+B.x)/2,(A.y+B.y)/2);
    }
    any=true;
   }
  }
  for(const s of this.stones){
   if(s.alive&&Math.hypot(s.x-this.cx,s.y-this.cy)-s.r>this.boardR){s.alive=false;this.onOut?.(s)}
  }
  this.moving=any;
  if(!this.moving)this.nextTurn();
  return true;
 }
 predict(stone,dx,dy){
  const d=Math.hypot(dx,dy);if(d<1)return null;
  const maxPull=MAX_PULL*this.scale,dd=Math.min(d,maxPull),p=Math.pow(dd/maxPull,POWER_CURVE);
  const speed=MAX_SPEED*this.scale*p*(stone.pw||1)/(1+((stone.m||1)-1)*.25);
  const f=stone.fric||this.mapDef.friction,dist=speed*(1/(1-f))*.92;
  return {x:stone.x+dx/d*dist,y:stone.y+dy/d*dist,dist};
 }
}

/* ============================================================
   AI — 상대를 판 바깥쪽으로 밀어내는 각도를 계산
============================================================ */
function pathBlocked(e,from,dirX,dirY,dist,ignore){
 for(const s of e.stones){
  if(!s.alive||ignore.includes(s))continue;
  const rx=s.x-from.x,ry=s.y-from.y,proj=rx*dirX+ry*dirY;
  if(proj<=0||proj>=dist)continue;
  const perp=Math.abs(rx*dirY-ry*dirX);
  if(perp<(s.r+from.r)*.95)return true;
 }
 return false;
}
function aiChooseShot(e,p,levelKey){
 const lv=AI_LEVELS[levelKey]||AI_LEVELS.hard;
 const mine=e.stones.filter(s=>s.owner===p&&s.alive),enemies=e.stones.filter(s=>s.owner!==p&&s.alive);
 if(!mine.length||!enemies.length)return null;
 const R=e.boardR;let best=null;
 for(const my of mine)for(const en of enemies){
  const ox=en.x-e.cx,oy=en.y-e.cy,od=Math.hypot(ox,oy)||1,ux=ox/od,uy=oy/od;
  const edge=Math.max(0,R-od),edgeF=1.25-edge/R;
  const cands=[];
  { // 정면으로 맞히기
   const dx=en.x-my.x,dy=en.y-my.y,d=Math.hypot(dx,dy)||1,ax=dx/d,ay=dy/d;
   cands.push({ax,ay,dist:d,q:Math.max(0,ax*ux+ay*uy)*.85+.18});
  }
  { // 바깥쪽으로 밀리도록 옆면을 노리기 (고스트볼)
   const gx=en.x-ux*(my.r+en.r),gy=en.y-uy*(my.r+en.r),dx=gx-my.x,dy=gy-my.y,d=Math.hypot(dx,dy)||1,ax=dx/d,ay=dy/d,cut=ax*ux+ay*uy;
   if(cut>.35&&d>my.r*1.2)cands.push({ax,ay,dist:d,q:cut*cut});
  }
  for(const c of cands){
   const blocked=pathBlocked(e,my,c.ax,c.ay,c.dist,[my,en]);
   // 내 알이 판 가장자리에서 바깥으로 튕겨 나갈 위험
   const myOut=Math.hypot(my.x-e.cx,my.y-e.cy)/R,risk=myOut>.7?Math.max(0,c.ax*(my.x-e.cx)/R+c.ay*(my.y-e.cy)/R)*.25:0;
   const sc=c.q*edgeF*1.6-c.dist/R*.35-(blocked?1.3:0)-risk+Math.random()*lv.noise;
   if(!best||sc>best.sc)best={sc,my,en,ax:c.ax,ay:c.ay,dist:c.dist,edge};
  }
 }
 const ang=Math.atan2(best.ay,best.ax)+(Math.random()-.5)*lv.err;
 const need=.62+.22*(best.dist/R)+.35*(best.edge/R);
 const power=Math.max(.45,Math.min(1,need*(.92+Math.random()*.12)))*lv.pw;
 const pull=MAX_PULL*e.scale*power;
 return {stoneId:best.my.id,dx:Math.cos(ang)*pull,dy:Math.sin(ang)*pull};
}

function rescaleEngine(e,newPx){

function recordTrail(e){
 if(acc.trail==="none")return;
 for(const s of e.stones){
  let arr=trailHistory.get(s.id)||[];
  if(s.alive&&(s.vx||s.vy)){const last=arr[arr.length-1];if(!last||Math.hypot(s.x-last.x,s.y-last.y)>1.2)arr.push({x:s.x,y:s.y})}

  if(!s.alive)arr=[];
  if(arr.length>9)arr.splice(0,arr.length-9);trailHistory.set(s.id,arr);

}
function hexA(hex,a){return hex+Math.round(Math.max(0,Math.min(1,a))*255).toString(16).padStart(2,"0")}
function spawnBurst(x,y,color,n,speed){

function spawnFloater(x,y,text,color,size){fx.floaters.push({x,y,text,color:color||"#fff",size:size||18,life:1})}
function updateFx(dt){

function drawBoard(e,now){

function drawAim(e,s,dx,dy,human){
 if(!s||!s.alive)return;
 const maxPull=MAX_PULL*e.scale,d=Math.hypot(dx,dy);if(d<2)return;
 const pd=Math.min(d,maxPull),nx=dx/d,ny=dy/d,pw=pd/maxPull;
 // 당긴 고무줄
 ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-nx*pd,s.y-ny*pd);ctx.strokeStyle=hexA("#ffffff",.35);ctx.lineWidth=2;ctx.stroke();
 ctx.beginPath();ctx.arc(s.x-nx*pd,s.y-ny*pd,4,0,Math.PI*2);ctx.fillStyle="#ffffffaa";ctx.fill();
 // 발사 방향 화살표
 const col=pw<.5?"#64f3d0":pw<.8?"#ffd166":"#ff5c78",len=s.r*1.6+pw*s.r*3.2,tx=s.x+nx*len,ty=s.y+ny*len;
 ctx.beginPath();ctx.moveTo(s.x+nx*s.r*1.1,s.y+ny*s.r*1.1);ctx.lineTo(tx,ty);ctx.strokeStyle=col;ctx.lineWidth=3.5;ctx.lineCap="round";ctx.stroke();
 ctx.beginPath();ctx.moveTo(tx+nx*8,ty+ny*8);ctx.lineTo(tx-ny*6,ty+nx*6);ctx.lineTo(tx+ny*6,ty-nx*6);ctx.closePath();ctx.fillStyle=col;ctx.fill();
 // 예측 조준선 (강화)
 if(human&&game.aimAssist&&s.owner===0){
  const pr=e.predict(s,dx,dy);if(pr){
   const lim=e.boardR-s.r*.2,dd=Math.hypot(pr.x-e.cx,pr.y-e.cy);let px=pr.x,py=pr.y;
   if(dd>lim){const k=lim/dd;px=e.cx+(pr.x-e.cx)*k;py=e.cy+(pr.y-e.cy)*k}
   ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(px,py);ctx.setLineDash([2,7]);ctx.strokeStyle="#ffd16699";ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([]);
   ctx.beginPath();ctx.arc(px,py,s.r*.85,0,Math.PI*2);ctx.strokeStyle="#ffd166bb";ctx.lineWidth=1.5;ctx.stroke();
  }
 }
}

function loop(g,t){
 if(game.gen!==g||!isActive("game"))return;
 const e=game.engine;if(!e)return;
 const dt=Math.min(100,Math.max(0,t-game.lastT));game.lastT=t;
 if(e.moving){
  game.acc+=dt*(game.fast?2.2:1);const stepMs=1000/60;let n=0;
  while(game.acc>=stepMs&&n<14){e.step();recordTrail(e);game.acc-=stepMs;n++;if(!e.moving){game.acc=0;onSettle();break}}
 }else{game.acc=0;if(trailHistory.size)recordTrail(e)}
 updateFx(dt);drawBoard(e,t);
 requestAnimationFrame(tt=>loop(g,tt));
}
